<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="color-scheme" content="dark"><title>JEHO · علاقة CP</title>
<style>
:root{color-scheme:dark;--bg:#100f20;--card:#211b36;--line:#49304f;--pink:#ff6caa;--gold:#f6d48b;--muted:#b9aecb}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;background:radial-gradient(ellipse at 50% -10%,#623052 0,#24182f 42%,#100f20 100%)}
header{display:flex;align-items:center;gap:12px;padding:16px;background:#160f22dd;border-bottom:1px solid #ffffff14;position:sticky;top:0;z-index:2;backdrop-filter:blur(12px)}button{font:inherit;cursor:pointer}.back{width:42px;height:42px;border:1px solid #ffffff1a;border-radius:14px;color:#fff;background:#ffffff10;font-size:24px}h1{font-size:19px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
main{max-width:620px;padding:18px;margin:auto}.hero{text-align:center;padding:22px 16px 18px;border-radius:26px;background:linear-gradient(145deg,#6b315c,#2a2045 72%);border:1px solid #f7b8d52b;box-shadow:0 16px 36px #0003}.heart{font-size:42px;color:#ff7eb4;display:inline-block;animation:pulse 1.15s ease-in-out infinite;filter:drop-shadow(0 0 12px #ff6caa70)}@keyframes pulse{0%,100%{transform:scale(.9)}50%{transform:scale(1.14)}}.hero h2{font-size:20px;margin:8px 0 5px}.hero p{font-size:12px;color:#f3dbea;margin:0}
.card{margin-top:14px;padding:17px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,#29213d,#1a182d);box-shadow:0 12px 28px #0002}.person{display:flex;align-items:center;gap:13px}.avatar{width:78px;height:78px;object-fit:cover;border-radius:24px;background:#383047;border:2px solid #f4b5d5}.personInfo{min-width:0;flex:1}.name{font-size:17px;font-weight:800;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px}.pill{display:inline-block;color:#ffd4e6;background:#ff6caa18;border:1px solid #ff6caa44;padding:5px 9px;border-radius:30px;font-size:11px;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}.stat{padding:13px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff0c}.stat label{display:block;font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:19px;color:var(--gold);margin-top:5px;overflow-wrap:anywhere}.action{width:100%;margin-top:14px;padding:13px;border:1px solid #ff9bc64d;border-radius:15px;background:#ff6caa16;color:#ffd5e8;font-weight:750}.empty,.status{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:22px 10px}.note{text-align:center;color:#8c819f;font-size:11px;padding:20px}
</style></head><body>
<header><button class="back" onclick="JehoApp.goBack()" aria-label="رجوع">‹</button><div><h1>علاقة CP</h1><div class="sub">بيانات العلاقة الفعلية المرتبطة بحسابك</div></div></header>
<main><section class="hero"><div class="heart">♥</div><h2 id="heroTitle">رابطك الخاص</h2><p id="heroSubtitle">المعلومات تُحمّل من حساب JEHO الحقيقي</p></section><section id="relationship" class="card"><div class="status">جارٍ تحميل بيانات العلاقة…</div></section><div class="note">تُعرض بيانات الشريك الفعلية فقط. لا تُنشأ أسماء أو صور بديلة.</div></main>
<script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){return Number(v||0).toLocaleString('en-US')}
function renderCpData(d){const rel=d&&d.relationship,box=document.getElementById('relationship');if(!rel||!rel.partner){document.getElementById('heroTitle').textContent='لا توجد علاقة فعّالة';document.getElementById('heroSubtitle').textContent='عند قبول علاقة CP ستظهر بياناتها هنا';box.innerHTML='<div class="empty">لا توجد علاقة CP فعّالة مرتبطة بحسابك حاليًا.</div><button class="action" onclick="JehoApp.openCpCenter()">اكتشاف علاقة CP</button>';return}const p=rel.partner;const name=p.displayName||p.username||'';document.getElementById('heroTitle').textContent=name?'أنت و'+name:'علاقة CP فعّالة';document.getElementById('heroSubtitle').textContent=rel.typeLabel||rel.type||'علاقة CP';const avatar=p.avatarUrl?'<img class="avatar" src="'+esc(p.avatarUrl)+'" alt="صورة الشريك" referrerpolicy="no-referrer">':'';box.innerHTML='<div class="person">'+avatar+'<div class="personInfo"><div class="name">'+esc(name||'اسم غير متوفر في بيانات الخادم')+'</div><div class="meta">مستوى الشريك: '+esc(p.level==null?'—':num(p.level))+' · VIP: '+esc(p.vipLevel==null?'—':num(p.vipLevel))+'</div><span class="pill">♥ '+esc(rel.typeLabel||rel.type||'علاقة CP')+'</span></div></div><div class="stats"><div class="stat"><label>مستوى العلاقة</label><strong>'+esc(rel.level==null?'—':num(rel.level))+'</strong></div><div class="stat"><label>نقاط العلاقة</label><strong>'+esc(rel.points==null?'—':num(rel.points))+'</strong></div><div class="stat"><label>مستوى الشريك</label><strong>'+esc(p.level==null?'—':num(p.level))+'</strong></div><div class="stat"><label>VIP الشريك</label><strong>'+esc(p.vipLevel==null?'—':num(p.vipLevel))+'</strong></div></div><button class="action" onclick="JehoApp.openCpCenter()">إدارة علاقة CP</button>'}
function showCpError(){document.getElementById('relationship').innerHTML='<div class="empty">تعذّر تحميل البيانات الآن. تحقق من اتصال التطبيق ثم أعد المحاولة.</div><button class="action" onclick="JehoApp.refreshData()">إعادة المحاولة</button>'}
window.renderCpData=renderCpData;window.showCpError=showCpError;if(window.JehoApp)JehoApp.refreshData();
</script></body></html>
