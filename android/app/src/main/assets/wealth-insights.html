<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>JEHO · الثروة</title>
<style>
:root{color-scheme:dark;--bg:#11101d;--card:#211f30;--line:#ffffff14;--gold:#f5d17d;--muted:#aaa8bf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;background:radial-gradient(ellipse at 50% -10%,#574525 0,#282238 43%,#11101d 100%)}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));background:#171522ee;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
button{font:inherit;cursor:pointer}.back{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;color:#fff;background:#ffffff10;font-size:24px}h1{font-size:19px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
main{max-width:640px;padding:15px;padding-bottom:max(26px,env(safe-area-inset-bottom));margin:auto}
.card{margin-top:13px;padding:17px;border:1px solid #f7d37e28;border-radius:23px;background:linear-gradient(150deg,#292538,#1b1a2a);box-shadow:0 12px 28px #0002}
.identity{display:flex;align-items:center;gap:14px;min-width:0}.avatar-stack{position:relative;width:78px;height:78px;flex:0 0 78px;isolation:isolate}.avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px;background:#383047;border:2px solid #f7d37e88}.real-frame{position:absolute;inset:-15%;width:130%;height:130%;object-fit:fill;z-index:2;pointer-events:none}.real-frame-video{position:absolute;inset:-15%;width:130%;height:130%;object-fit:fill;z-index:2;pointer-events:none}.personInfo{min-width:0;flex:1}.eyebrow{font-size:11px;color:#f5d17d;font-weight:750}.name{font-size:19px;font-weight:850;overflow-wrap:anywhere;margin-top:5px}.meta{font-size:12px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.sectionHead{display:flex;align-items:center;gap:8px;margin:22px 3px 10px}.sectionHead h2{font-size:16px;margin:0}.sectionHead p{font-size:12px;color:var(--muted);margin:5px 0 0;line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}.stat{min-width:0;padding:14px;border-radius:17px;background:#ffffff08;border:1px solid #ffffff0c}.statTop{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.statIcon{display:grid;place-items:center;width:30px;height:30px;border-radius:10px;background:#f7d37e15;font-size:16px}.stat strong{display:block;font-size:21px;color:var(--gold);margin-top:9px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.infoRow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.infoRow:last-child{border-bottom:0}.infoLabel{font-size:13px;color:var(--muted)}.infoValue{font-size:13px;font-weight:750;overflow-wrap:anywhere;text-align:left;direction:ltr}
.action{width:100%;margin-top:15px;padding:13px;border:1px solid #f7d37e45;border-radius:15px;background:#f7d37e14;color:#ffe7ae;font-weight:750}.status{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:20px 10px}
</style></head>
<body>
<header><button class="back" aria-label="رجوع" onclick="goBack()">‹</button><div><h1>الثروة</h1><div class="sub">ملخص ثروتك وبيانات حسابك</div></div></header>
<main>
<section class="card">
 <div class="identity">
  <span id="meAvatarStack" class="avatar-stack"><img id="meAvatar" class="avatar" alt="" hidden><img id="meFrame" class="real-frame" alt="" hidden></span>
  <div class="personInfo"><div class="eyebrow">حسابك في JEHO</div><div class="name" id="meName">جارٍ تحميل الحساب…</div><div class="meta" id="meMeta">يتم جلب بيانات حسابك من الخادم</div></div>
 </div>
 <div class="stats">
  <div class="stat"><div class="statTop"><span class="statIcon">💎</span>مستوى الثروة</div><strong id="wealthLevel">—</strong></div>
  <div class="stat"><div class="statTop"><span class="statIcon">✨</span>نقاط الثروة</div><strong id="wealthScore">—</strong></div>
  <div class="stat"><div class="statTop"><span class="statIcon">⭐</span>المستوى العام</div><strong id="userLevel">—</strong></div>
  <div class="stat"><div class="statTop"><span class="statIcon">🌟</span>نقاط الشعبية</div><strong id="charmScore">—</strong></div>
 </div>
 <button class="action" id="refresh" onclick="refreshWealthData()">↻ تحديث بيانات الحساب</button>
</section>
<div class="sectionHead"><div><h2>بيانات الحساب</h2><p>المعلومات المتوفرة من حسابك الفعلي فقط.</p></div></div>
<section class="card" style="margin-top:0">
 <div class="infoRow"><span class="infoLabel">معرّف الحساب</span><span class="infoValue" id="accountId">—</span></div>
 <div class="infoRow"><span class="infoLabel">اسم المستخدم</span><span class="infoValue" id="username">—</span></div>
 <div class="infoRow"><span class="infoLabel">مستوى VIP</span><span class="infoValue" id="vipLevel">—</span></div>
</section>
<div id="pageStatus" class="status" hidden></div>
</main>
<script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){if(v==null||v==='')return '—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US'):'—'}
function safeImage(v){const s=String(v||'').trim();if(s.startsWith('https://')||s.startsWith('http://'))return s;if(s.startsWith('//'))return 'https:'+s;if(s.startsWith('/'))return 'https://jeho-own-backend.mgs.blitz.cloud'+s;if(s&&!s.includes(':'))return 'https://jeho-own-backend.mgs.blitz.cloud/'+s;return ''}
function goBack(){if(window.JehoApp&&typeof JehoApp.goBack==='function')JehoApp.goBack()}
function refreshWealthData(){const b=document.getElementById('refresh');b.disabled=true;b.textContent='جارٍ تحديث البيانات…';if(window.JehoApp&&typeof JehoApp.refreshData==='function')JehoApp.refreshData();else showWealthError()}
function renderWealthData(d){
 const u=d&&d.user||{};
 document.getElementById('meName').textContent=u.displayName||u.username||'—';
 document.getElementById('meMeta').textContent=u.publicId!=null&&String(u.publicId)!==''?'JEHO ID · '+u.publicId:'بيانات الحساب';
 document.getElementById('accountId').textContent=u.publicId==null||String(u.publicId)===''?'—':String(u.publicId);
 document.getElementById('username').textContent=u.username==null||u.username===''?'—':String(u.username);
 document.getElementById('vipLevel').textContent=u.vipLevel==null?'—':num(u.vipLevel);
 document.getElementById('wealthLevel').textContent=u.wealthLevel==null?'—':num(u.wealthLevel);
 document.getElementById('wealthScore').textContent=u.wealthScore==null?'—':num(u.wealthScore);
 document.getElementById('userLevel').textContent=u.level==null?'—':num(u.level);
 document.getElementById('charmScore').textContent=u.charmScore==null?'—':num(u.charmScore);
 const av=document.getElementById('meAvatar'),stack=document.getElementById('meAvatarStack');
 const avatar=safeImage(u.avatarUrl),frame=safeImage(u.frameUrl||u.hostBadgeUrl||u.vipBadgeUrl);
 if(avatar){av.src=avatar;av.hidden=false;av.onerror=()=>{av.hidden=true}}else{av.removeAttribute('src');av.hidden=true}
 const oldFrame=document.getElementById('meFrame');if(oldFrame){if(oldFrame.tagName==='VIDEO')oldFrame.pause();oldFrame.remove()}
 if(frame){const clean=frame.split('?')[0].toLowerCase();let el;if(/\.(mp4|webm|mov)$/.test(clean)){el=document.createElement('video');el.className='real-frame-video';el.autoplay=true;el.muted=true;el.loop=true;el.playsInline=true;el.preload='none';const source=document.createElement('source');source.src=frame;el.appendChild(source)}else{el=document.createElement('img');el.className='real-frame';el.alt='';el.onerror=()=>{el.hidden=true};el.src=frame}el.id='meFrame';el.setAttribute('aria-hidden','true');stack.appendChild(el);if(el.tagName==='VIDEO')el.play().catch(()=>{})}
 const b=document.getElementById('refresh');b.disabled=false;b.textContent='↻ تحديث بيانات الحساب';
 const s=document.getElementById('pageStatus');s.hidden=true;
}
function showWealthError(){const b=document.getElementById('refresh');b.disabled=false;b.textContent='↻ إعادة المحاولة';const s=document.getElementById('pageStatus');s.hidden=false;s.textContent='تعذّر تحديث بيانات الحساب من الخادم. اضغط إعادة المحاولة.'}
window.renderWealthData=renderWealthData;window.showWealthError=showWealthError;window.refreshWealthData=refreshWealthData;
</script></body></html>
