<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>JEHO · الثروة</title>
<style>
:root{color-scheme:dark;--bg:#11101d;--card:#211f30;--line:#47402e;--gold:#f7d37e;--muted:#aaa8bf}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;background:radial-gradient(ellipse at 50% -10%,#574525 0,#282238 43%,#11101d 100%)}
header{display:flex;align-items:center;gap:12px;padding:16px;padding-top:max(16px,env(safe-area-inset-top));background:#171522e8;border-bottom:1px solid #ffffff14;position:sticky;top:0;z-index:2;backdrop-filter:none}button{font:inherit;cursor:pointer}.back{width:42px;height:42px;border:1px solid #ffffff1a;border-radius:14px;color:#fff;background:#ffffff10;font-size:24px}h1{font-size:19px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
main{max-width:640px;padding:16px;padding-bottom:max(24px,env(safe-area-inset-bottom));margin:auto}.hero{padding:22px 18px;border-radius:25px;background:linear-gradient(140deg,#6a5329,#302641 75%);border:1px solid #f7d37e3b;box-shadow:0 16px 36px #0003}.eyebrow{color:#ffe8b3;font-size:12px}.hero h2{font-size:22px;margin:7px 0}.hero p{font-size:12px;line-height:1.7;color:#e0d7c9;margin:0}.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(150deg,#292538,#1b1a2a);box-shadow:0 12px 28px #0002}.person{display:flex;align-items:center;gap:13px}.avatar-stack{position:relative;width:64px;height:64px;flex-shrink:0;isolation:isolate}.avatar{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:20px;background:#383047;border:2px solid #f7d37e70}.real-frame,.real-frame-video{position:absolute;inset:-15%;width:130%;height:130%;object-fit:fill;z-index:2;pointer-events:none}.rankAvatarStack{position:relative;display:grid;place-items:center;width:43px;height:43px;flex-shrink:0;isolation:isolate}.rankAvatarStack .rankAvatar{position:absolute;inset:0;width:100%;height:100%;border-radius:15px;object-fit:cover;background:#383047}.personInfo{min-width:0;flex:1}.name{font-size:16px;font-weight:800;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);margin-top:5px}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.stat{padding:13px;border-radius:16px;background:#ffffff08;border:1px solid #ffffff0c}.stat label{display:block;font-size:11px;color:var(--muted)}.stat strong{display:block;font-size:19px;color:var(--gold);margin-top:5px;overflow-wrap:anywhere}.categories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.category{border:1px solid #f7d37e25;border-radius:13px;padding:10px 4px;color:#d4c9b4;background:#ffffff08;font-size:11px;font-weight:750}.category.active{color:#1a1420;background:linear-gradient(135deg,#ffe5a0,#c99b43);border-color:#ffe5a0}.periods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:18px 0 4px}.period{border:1px solid #f7d37e35;border-radius:14px;padding:10px 5px;color:#d4c9b4;background:#ffffff08;font-size:12px;font-weight:750}.period.active{color:#1a1420;background:linear-gradient(135deg,#ffe5a0,#c99b43);border-color:#ffe5a0;box-shadow:0 5px 18px #d6a74c28}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:20px 3px 10px}.sectionHead h2{font-size:16px;margin:0}.pill{font-size:11px;color:#ffe7ae;border:1px solid #f7d37e45;border-radius:30px;padding:5px 9px}.rank{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #ffffff10}.rank:last-child{border-bottom:0}.rankNo{width:31px;height:31px;display:grid;place-items:center;border-radius:10px;background:#f7d37e18;color:var(--gold);font-weight:850;flex-shrink:0}.rankAvatar{width:43px;height:43px;border-radius:15px;object-fit:cover;background:#383047}.rankInfo{min-width:0;flex:1}.rankName{font-size:13px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rankScore{font-size:12px;color:var(--gold);margin-top:4px}.action{width:100%;margin-top:14px;padding:13px;border:1px solid #f7d37e45;border-radius:15px;background:#f7d37e14;color:#ffe7ae;font-weight:750}.empty,.status{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:20px 10px}.note{text-align:center;color:#827c95;font-size:11px;padding:20px}
</style></head><body>
<header><div><h1>الثروة</h1><div class="sub">حسابك وترتيبك في JEHO</div></div></header>
<main><section class="card"><div class="person"><span id="meAvatarStack" class="avatar-stack"><img id="meAvatar" class="avatar" alt="" hidden><img id="meFrame" class="real-frame" alt="" hidden></span><div class="personInfo"><div class="name" id="meName">جارٍ تحميل الحساب…</div><div class="meta" id="meMeta">بيانات حسابك</div></div></div><div class="stats"><div class="stat"><label>مستوى الثروة</label><strong id="wealthLevel">—</strong></div><div class="stat"><label>نقاط الثروة</label><strong id="wealthScore">—</strong></div><div class="stat"><label>المستوى العام</label><strong id="userLevel">—</strong></div><div class="stat"><label>نقاط الشعبية</label><strong id="charmScore">—</strong></div></div><button class="action" onclick="JehoApp.openWealthRanking()">عرض ترتيب الأغنياء الكامل ←</button></section>
<div class="sectionHead"><h2>أقسام الترتيب</h2><span class="pill" id="rankingCategoryLabel">الأغنياء</span></div><div class="categories" role="group" aria-label="أقسام الترتيب"><button class="category active" data-category="rich" onclick="selectCategory('rich')">💎 الأغنياء</button><button class="category" data-category="popular" onclick="selectCategory('popular')">⭐ الشعبية</button><button class="category" data-category="gifts" onclick="selectCategory('gifts')">🎁 الهدايا</button><button class="category" data-category="host" onclick="selectCategory('host')">🎤 المضيفون</button><button class="category" data-category="agency" onclick="selectCategory('agency')">🏢 الوكالات</button><button class="category" data-category="room" onclick="selectCategory('room')">🏠 الغرف</button></div><div class="periods" role="group" aria-label="فترة ترتيب الثروة"><button class="period active" data-period="daily" onclick="selectPeriod('daily')">يومي</button><button class="period" data-period="weekly" onclick="selectPeriod('weekly')">أسبوعي</button><button class="period" data-period="monthly" onclick="selectPeriod('monthly')">شهري</button></div><div class="sectionHead"><h2>🏆 ترتيب JEHO</h2><span class="pill" id="rankingPeriodLabel">اليومي</span></div><section class="card"><div id="ranking"><div class="status">جارٍ تحميل الترتيب…</div></div><button class="action" onclick="refreshWealthData()">↻ تحديث الترتيب</button></section></main>
<script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){if(v==null||v==='')return '—';const n=Number(v);return Number.isFinite(n)?n.toLocaleString('en-US'):'—'}
function safeImage(v){const s=String(v||'').trim();if(s.startsWith('https://')||s.startsWith('http://'))return s;if(s.startsWith('//'))return 'https:'+s;if(s.startsWith('/'))return 'https://jeho-own-backend.mgs.blitz.cloud'+s;if(s&&!s.includes(':'))return 'https://jeho-own-backend.mgs.blitz.cloud/'+s;return ''}
function frameMarkup(person,cls){const p=person||{},src=safeImage(p.frameUrl||p.hostBadgeUrl||p.vipBadgeUrl);if(!src)return '';const clean=src.split('?')[0].toLowerCase();if(clean.endsWith('.mp4')||clean.endsWith('.webm')||clean.endsWith('.mov'))return '<video class="'+cls+' real-frame-video" muted loop playsinline preload="none" aria-hidden="true"><source src="'+esc(src)+'"></video>';if(['.png','.jpg','.jpeg','.gif','.webp','.svg','.avif'].some(ext=>clean.endsWith(ext))||!clean.slice(clean.lastIndexOf('/')+1).includes('.'))return '<img class="'+cls+' real-frame" src="'+esc(src)+'" alt="" aria-hidden="true" loading="lazy" decoding="async" referrerpolicy="no-referrer">';return ''}
function rankAvatar(person){const p=person||{},src=safeImage(p.avatarUrl),face=src?'<img class="rankAvatar" src="'+esc(src)+'" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">':'<span class="rankAvatar" aria-hidden="true"></span>';return '<span class="rankAvatarStack">'+face+frameMarkup(p,'rankFrame')+'</span>'}
let currentPeriod="daily",currentCategory="rich";function selectPeriod(period){if(!["daily","weekly","monthly"].includes(period))return;currentPeriod=period;document.querySelectorAll(".period").forEach(b=>b.classList.toggle("active",b.dataset.period===period));document.getElementById("rankingPeriodLabel").textContent=({daily:"اليومي",weekly:"الأسبوعي",monthly:"الشهري"})[period];document.getElementById("ranking").innerHTML='<div class="status">جارٍ تحميل الترتيب الحقيقي…</div>';if(window.JehoApp&&typeof JehoApp.loadWealthPeriod==='function')JehoApp.loadWealthPeriod(period);else showWealthError()}function selectCategory(category){if(!["rich","popular","gifts","host","agency","room"].includes(category))return;currentCategory=category;document.querySelectorAll(".category").forEach(b=>b.classList.toggle("active",b.dataset.category===category));document.getElementById("rankingCategoryLabel").textContent=({rich:"الأغنياء",popular:"الشعبية",gifts:"الهدايا",host:"المضيفون",agency:"الوكالات",room:"الغرف"})[category];document.getElementById("ranking").innerHTML='<div class="status">جارٍ تحميل القسم الحقيقي…</div>';if(window.JehoApp&&typeof JehoApp.loadWealthCategory==='function')JehoApp.loadWealthCategory(category);else showWealthError()}
function refreshWealthData(){if(window.JehoApp&&typeof JehoApp.refreshData==='function'){document.getElementById('ranking').innerHTML='<div class="status">جارٍ تحديث البيانات من الخادم…</div>';JehoApp.refreshData()}else showWealthError()}
function renderWealthData(d){const u=d&&d.user||{};document.getElementById('meName').textContent=u.displayName||u.username||'حسابي';document.getElementById('meMeta').textContent='ID: '+(u.publicId||'—');const meAvatar=safeImage(u.avatarUrl),meFrame=safeImage(u.frameUrl||u.hostBadgeUrl||u.vipBadgeUrl);if(meAvatar){const a=document.getElementById('meAvatar');a.src=meAvatar;a.hidden=false}if(meFrame){const f=document.getElementById('meFrame'),clean=meFrame.split('?')[0].toLowerCase();if(/\.(mp4|webm|mov)$/.test(clean)){const v=document.createElement('video');v.className='real-frame-video';v.autoplay=true;v.muted=true;v.loop=true;v.playsInline=true;v.preload='none';v.setAttribute('aria-hidden','true');const s=document.createElement('source');s.src=meFrame;v.appendChild(s);f.replaceWith(v)}else{f.src=meFrame;f.hidden=false}}document.getElementById('wealthLevel').textContent=u.wealthLevel==null?'—':num(u.wealthLevel);document.getElementById('wealthScore').textContent=u.wealthScore==null?'—':num(u.wealthScore);document.getElementById('userLevel').textContent=u.level==null?'—':num(u.level);document.getElementById('charmScore').textContent=u.charmScore==null?'—':num(u.charmScore);const activePeriod=(d&&d.rankingPeriod)||"daily";currentPeriod=activePeriod;const activeCategory=(d&&d.rankingCategory)||currentCategory;currentCategory=activeCategory;document.querySelectorAll(".category").forEach(b=>b.classList.toggle("active",b.dataset.category===activeCategory));document.getElementById("rankingCategoryLabel").textContent=({rich:"الأغنياء",popular:"الشعبية",gifts:"الهدايا",host:"المضيفون",agency:"الوكالات",room:"الغرف"})[activeCategory]||"الأغنياء";document.querySelectorAll(".period").forEach(b=>b.classList.toggle("active",b.dataset.period===activePeriod));document.getElementById("rankingPeriodLabel").textContent=({daily:"اليومي",weekly:"الأسبوعي",monthly:"الشهري"})[activePeriod]||"اليومي";const rows=Array.isArray(d&&d.ranking)?d.ranking:[],box=document.getElementById('ranking');if(d&&d.rankingError){box.innerHTML='<div class="empty">تعذّر تحميل ترتيب الثروة من الخادم.</div><button class="action" onclick="JehoApp.refreshData()">إعادة المحاولة</button>';return}if(!rows.length){box.innerHTML='<div class="empty">لا تتوفر نتائج ترتيب الثروة حاليًا.</div>';return}box.innerHTML=rows.slice(0,30).map((r,i)=>{const p=r.user||{};return '<div class="rank"><div class="rankNo">'+esc(r.rank==null?'—':num(r.rank))+'</div>'+rankAvatar(p)+'<div class="rankInfo"><div class="rankName">'+esc(p.displayName||p.username||r.targetName||'اسم غير متوفر')+'</div><div class="rankScore">💎 '+esc(num(r.score))+'</div></div></div>').join('')}
function showWealthError(){document.getElementById('ranking').innerHTML='<div class="empty">تعذّر تحميل ترتيب الثروة الآن. حاول مجددًا.</div><button class="action" onclick="JehoApp.refreshData()">إعادة المحاولة</button>'}
window.renderWealthData=renderWealthData;window.showWealthError=showWealthError;window.refreshWealthData=refreshWealthData;
</script></body></html>
