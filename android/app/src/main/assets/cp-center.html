<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8d205f">
<title>علاقات CP ❤️</title>
<style>
:root{--pink:#ff70ad;--gold:#ffda72;--bg:#31072d;--text:#fff4fb;--muted:#dfbdd3}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;color:var(--text);background:radial-gradient(ellipse at top,#c14c8b,transparent 55%),linear-gradient(160deg,#a52f70,#641449 50%,#25031f);min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
.app{max-width:620px;margin:auto;min-height:100vh;padding-bottom:100px}
header{display:flex;align-items:center;justify-content:space-between;padding:20px}
header h1{color:var(--gold);font-size:25px;margin:0}
header button{background:none;border:0;font-size:28px}
.content{padding:0 16px}
.panel{border:1px solid #ffffff30;background:#ffffff12;border-radius:25px;padding:17px;margin:12px 0 20px;box-shadow:0 8px 25px #22001d35}
.title{text-align:center;color:var(--gold);font-size:22px;margin:12px 0 18px}
.pair{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;gap:5px;text-align:center;min-height:150px}
.person{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.avatar{width:clamp(78px,23vw,125px);aspect-ratio:1;border-radius:50%;border:5px solid var(--gold);background:linear-gradient(135deg,#ffe5f4,#702050);object-fit:cover}
.avatar.pink{border-color:var(--pink)}
.username-btn{max-width:100%;overflow-wrap:anywhere;word-break:break-word;border:1px solid #fff1bd;border-radius:24px;padding:8px 12px;background:linear-gradient(145deg,#fff0c4,#f3c15a 55%,#b96d20);color:#4b1536;font-size:13px;font-weight:900;box-shadow:0 3px 0 #6b321b,0 5px 12px #18001455;transition:.2s}
.username-btn:active{transform:translateY(2px) scale(.98)}
.names .username-btn{margin:4px 0}
.heart{display:flex;align-items:center;justify-content:center}
.emblem{position:relative;width:70px;height:90px;display:flex;align-items:center;justify-content:center}
.core{font-size:44px;filter:drop-shadow(0 0 8px #ff2020);animation:pulse 1.5s infinite}
.ring{font-size:30px;display:inline-block;animation:ring 1.3s ease-in-out infinite;filter:drop-shadow(0 0 5px #ffd76a)}
.top-symbols{position:absolute;top:0;font-size:13px;white-space:nowrap}
.no-wings .top-symbols{display:none}
.no-wings .core{font-size:50px}
.relation-mark{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px}
.relation-mark .core{font-size:75px}
.relation-mark .ring{font-size:42px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes ring{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-5px) rotate(12deg)}}
.pills{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.pill{padding:8px 15px;border-radius:30px;background:linear-gradient(100deg,#ffe98a,#f6b83b);color:#5a173d;font-weight:bold}
.tabs{display:flex;gap:5px;background:#31072d99;padding:6px;border:1px solid #ffffff30;border-radius:35px;margin:18px 0}
.tabs button{flex:1;border:0;background:transparent;border-radius:30px;padding:12px 4px;font-weight:bold;color:#e4c6da}
.tabs button.active{background:linear-gradient(110deg,#ff70ad,#c91b75);color:white}
.row{display:grid;grid-template-columns:50px 1fr 35px;align-items:center;gap:8px;padding:12px;border:1px solid #ffffff25;border-radius:22px;background:#ffffff10;margin:10px 0}
.rank{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#ffe08a;color:#4a1640;font-weight:bold}
.score{direction:ltr;color:var(--gold);font-weight:bold;text-align:center;font-size:14px}
.names{text-align:center;line-height:1.5;overflow-wrap:anywhere}
.names .username-btn{display:inline-block}
.name-heart{color:#ffacd2;font-size:20px}
.action{border:1px solid #ffb1d3;border-radius:30px;background:linear-gradient(110deg,#ff6cab,#c51b72);padding:12px 20px;font-weight:bold}
.hidden{display:none!important}
.rule{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid #ffffff25;border-radius:20px;background:#ffffff0b;margin:10px 0}
.rule-num{min-width:32px;height:32px;display:grid;place-items:center;background:linear-gradient(120deg,#ff70ad,#c51b75);border-radius:50%;font-weight:bold}
.rule p{margin:0;line-height:1.8}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.bottom{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);width:min(580px,calc(100% - 24px));display:grid;grid-template-columns:repeat(3,1fr);padding:10px;border:1px solid #ffb9dc66;border-radius:35px;background:#510a3fee;box-shadow:0 8px 25px #16001388}
.bottom button{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;font-weight:bold;font-size:13px}
.navicon{font-size:29px}
.modal-bg{position:fixed;inset:0;background:#140012cc;z-index:10;display:grid;place-items:center;padding:20px}
.modal{width:min(420px,100%);border:1px solid var(--gold);border-radius:25px;background:linear-gradient(160deg,#8e205d,#320629);padding:22px;text-align:center;box-shadow:0 15px 45px #13000f}
.modal h2{color:var(--gold);overflow-wrap:anywhere}
.close{float:left;background:none;border:0;font-size:26px}
.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:15;background:#3b0c32;border:1px solid var(--gold);border-radius:16px;padding:12px 18px;max-width:90%;text-align:center}
.note{font-size:12px;color:var(--muted);line-height:1.7}
</style>
</head>
<body>
<div class="app">
<header>
<button id="back" aria-label="رجوع">‹</button>
<h1 id="pageTitle">ثنائيات الأسبوع</h1>
<button id="help" aria-label="القواعد">ⓘ</button>
</header>
<main class="content">
<section id="weekly">
<div class="panel">
<h2 class="title">💞 ثنائي الأسبوع المميز 💞</h2>
<div id="featured"><p class="empty">جارٍ تحميل البيانات…</p></div>
<div class="pills"><span class="pill" id="featuredScore">🔥 —</span><span class="pill" id="featuredDays">❤️ —</span></div>
</div>
<div class="panel">
<h2 class="title">🏆 ترتيب الثنائيات</h2>
<div class="tabs"><button class="active" data-tab="ranking">الأسبوع</button><button data-tab="world">العالمي</button><button data-tab="rewards">المكافآت</button></div>
<div id="rankingView"><p class="empty">جارٍ تحميل الترتيب…</p></div><div id="worldView" class="hidden"></div><div id="rewardsView" class="hidden"></div>
</div>
</section>
<section id="relationship" class="hidden">
<div class="panel"><h2 class="title">❤️ علاقاتي</h2><div id="mineView"><div class="relation-mark"><span class="core">❤️</span><span class="ring">💍</span></div><p class="empty">جارٍ تحميل علاقاتك…</p><button class="action" id="inviteButton">إرسال دعوة CP</button></div></div>
<div class="panel"><h2 class="title">📩 الدعوات</h2><div id="invites"><p class="empty">جارٍ تحميل الدعوات…</p></div></div>
</section>
<section id="rules" class="hidden"><div class="panel"><h2 class="title">💖 قواعد CP</h2><div id="rulesList"></div></div></section>
</main>
<nav class="bottom"><button data-page="weekly"><span class="navicon">🏆</span>الثنائيات</button><button data-page="relationship"><span class="navicon">❤️</span>علاقاتي</button><button data-page="rules"><span class="navicon">💖</span>القواعد</button></nav>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const API_ENDPOINTS={weekly:"/api/cp/weekly",relationship:"/api/cp/relationship",levels:"/api/cp/levels",invites:"/api/cp/invites",rewards:"/api/cp/rewards",rules:"/api/cp/rules"};
const data={weekly:{featured:null,leaderboard:[],world:[]},relationship:{active:false,invites:[]},rewards:[],rules:["تبدأ علاقة CP بإرسال هدية ارتباط CP من داخل الروم الصوتي.","لا تنشأ العلاقة إلا بعد موافقة المستلم على الطلب.","تظهر العلاقات النشطة والنقاط والأسماء والصور حسب بيانات خادم JEHO.","يمكن لأي طرف إنهاء العلاقة وفق قواعد التطبيق.","تُحدد النقاط والمكافآت من إعدادات خادم JEHO."]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function score(n){n=Number(n)||0;if(n>=1000000)return(n/1000000).toFixed(1).replace(/\.0$/,"")+"M";if(n>=1000)return(n/1000).toFixed(1).replace(/\.0$/,"")+"K";return String(n);}
const fallback="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="a"><stop stop-color="#ffe5f4"/><stop offset="1" stop-color="#7c2459"/></linearGradient></defs><circle cx="50" cy="50" r="50" fill="url(#a)"/><circle cx="50" cy="37" r="18" fill="#fff1f9"/><path d="M15 96Q18 60 50 60T85 96" fill="#fff1f9"/></svg>');
function person(p,pink=false){const name=p?.name||"مستخدم";return '<div class="person"><img class="avatar '+(pink?'pink':'')+'" src="'+esc(p?.avatar||fallback)+'" alt="صورة المستخدم" onerror="this.onerror=null;this.src=\''+fallback+'\'"><button class="username-btn" data-user-id="'+esc(p?.id||"")+'" data-user-name="'+esc(name)+'">'+esc(name)+'</button></div>';}
function pair(p,noWings=false){const emblem=noWings?'<span class="core">❤️</span><span class="ring">💍</span>':'<div class="top-symbols">❤ 💍 ❤</div><span class="core">❤️</span>';return '<div class="pair">'+person(p.a)+'<div class="heart"><div class="emblem '+(noWings?'no-wings':'')+'">'+emblem+'</div></div>'+person(p.b,true)+'</div>';}
function row(r,i){const a=r.a?.name||"مستخدم",b=r.b?.name||"مستخدم";return '<div class="row"><div class="score">'+score(r.score)+'</div><div class="names"><button class="username-btn" data-user-id="'+esc(r.a?.id||"")+'" data-user-name="'+esc(a)+'">'+esc(a)+'</button><div class="name-heart">♥</div><button class="username-btn" data-user-id="'+esc(r.b?.id||"")+'" data-user-name="'+esc(b)+'">'+esc(b)+'</button></div><div class="rank">'+i+'</div></div>';}
function render(){const w=data.weekly;const f=w.featured;if(f){$("featured").innerHTML=pair(f);$("featuredScore").textContent="🔥 "+score(f.score);$("featuredDays").textContent="❤️ "+(f.days||0)+" أيام";}else{$("featured").innerHTML='<p class="empty">لا توجد بيانات لثنائي الأسبوع حالياً</p>';$("featuredScore").textContent="🔥 —";$("featuredDays").textContent="❤️ —";}
$("rankingView").innerHTML=w.leaderboard.length?w.leaderboard.map((r,i)=>row(r,i+1)).join(""):'<p class="empty">لا توجد نتائج أسبوعية متاحة حالياً</p>';
$("worldView").innerHTML=w.world.length?w.world.map((r,i)=>row(r,i+1)).join(""):'<p class="empty">لا توجد بيانات عالمية متاحة حالياً</p>';
$("rewardsView").innerHTML=data.rewards.length?data.rewards.map(r=>'<div class="panel"><h3 style="color:var(--gold)">'+esc(r.title||r.name||"مكافأة CP")+'</h3><p>'+esc(r.description||r.reward||"المكافأة حسب إعدادات الخادم")+'</p></div>').join(""):'<p class="empty">لا توجد مكافآت مضبوطة حالياً من الخادم</p>';
$("rulesList").innerHTML=data.rules.map((r,i)=>'<div class="rule"><span class="rule-num">'+(i+1)+'</span><p>'+esc(typeof r==="string"?r:(r.text||r.description||r.title||"قاعدة CP"))+'</p></div>').join("");
const rel=data.relationship;if(rel.active&&rel.partner){$("mineView").innerHTML=pair({a:rel.me||{name:"أنت"},b:rel.partner},true)+'<p class="empty">علاقتك الحالية ❤️</p><button class="action" id="inviteButton">إرسال دعوة CP</button>';}else{$("mineView").innerHTML='<div class="relation-mark"><span class="core">❤️</span><span class="ring">💍</span></div><p class="empty">ما عندك علاقة CP حالياً</p><button class="action" id="inviteButton">كيفية إرسال هدية ارتباط CP</button>';}
$("invites").innerHTML=rel.invites.length?rel.invites.map(v=>'<div class="panel"><strong>'+esc(v.name||v.sender?.name||"طلب ارتباط CP")+'</strong><p>'+esc(v.statusText||v.status||"بانتظار الرد")+'</p>'+(v.id&&v.pending?'<div class="pills"><button class="action" data-response="'+esc(v.id)+'" data-accept="true">قبول</button><button class="action" data-response="'+esc(v.id)+'" data-accept="false">رفض</button></div>':"")+'</div>').join(""):'<p class="empty">لا توجد دعوات حالياً</p>';
$("inviteButton").onclick=()=>toast("افتح الروم الصوتي ثم الهدايا واختر «هدية ارتباط CP». العلاقة لا تبدأ إلا بعد موافقة المستلم.");
}
function page(name){["weekly","relationship","rules"].forEach(id=>$(id).classList.toggle("hidden",id!==name));$("pageTitle").textContent=name==="weekly"?"ثنائيات الأسبوع":name==="relationship"?"علاقاتي":"قواعد CP";if(name==="relationship"&&window.JehoCP){JehoCP.loadHome();JehoCP.loadRequests();}}
function toast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),2500);}
function modal(name,id){$("modalRoot").innerHTML='<div class="modal-bg" id="modalBg"><div class="modal"><button class="close" id="closeModal">×</button><h2>'+esc(name)+'</h2><div style="font-size:45px">👤</div><p>ملف المستخدم</p><p class="note">بيانات الملف الشخصي تُفتح من خلال تطبيق JEHO.</p><button class="action" id="openProfile">عرض الملف الشخصي</button></div></div>';$("closeModal").onclick=()=>$("modalRoot").innerHTML="";$("modalBg").onclick=e=>{if(e.target.id==="modalBg")$("modalRoot").innerHTML="";};$("openProfile").onclick=()=>{if(window.JehoCP&&id)JehoCP.openProfile(id);$("modalRoot").innerHTML="";};}
document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>page(b.dataset.page));
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));["ranking","world","rewards"].forEach(id=>$(id+"View").classList.toggle("hidden",id!==b.dataset.tab));if(b.dataset.tab==="ranking"&&window.JehoCP)JehoCP.loadLeaderboard("weekly");if(b.dataset.tab==="world"&&window.JehoCP)JehoCP.loadLeaderboard("world");if(b.dataset.tab==="rewards"&&window.JehoCP)JehoCP.loadRewards();});
$("back").onclick=()=>{if(!$("relationship").classList.contains("hidden"))page("weekly");else if(!$("rules").classList.contains("hidden"))page("weekly");else if(window.JehoCP)JehoCP.back();};
$("help").onclick=()=>page("rules");
document.addEventListener("click",e=>{const b=e.target.closest("[data-user-name]");if(b)modal(b.dataset.userName,b.dataset.userId);const r=e.target.closest("[data-response]");if(r&&window.JehoCP)JehoCP.respondRequest(r.dataset.response,r.dataset.accept==="true");});
window.renderCpHome=function(rows){rows=Array.isArray(rows)?rows:[];const active=rows.filter(r=>r.status==="active");const partner=active[0];data.relationship.active=!!partner;data.relationship.me=partner?.self?{id:partner.self.id,name:partner.self.displayName||partner.self.username,avatar:partner.self.avatarUrl}:null;data.relationship.partner=partner?.partner?{id:partner.partner.id,name:partner.partner.displayName||partner.partner.username,avatar:partner.partner.avatarUrl}:null;data.relationship.points=partner?.points||0;data.weekly.featured=partner?{a:{id:partner.self?.id,name:partner.self?.displayName||partner.self?.username,avatar:partner.self?.avatarUrl},b:{id:partner.partner?.id,name:partner.partner?.displayName||partner.partner?.username,avatar:partner.partner?.avatarUrl},score:partner.points||0,days:partner.days||0}:null;render();};
window.renderCpRequests=function(incoming,sent){const inc=Array.isArray(incoming)?incoming:[];data.relationship.invites=inc.filter(r=>r.status==="pending").map(r=>({id:r.id,name:r.sender?.displayName||r.sender?.username,sender:r.sender,status:r.status,statusText:"طلب ارتباط بانتظار ردك",pending:true}));render();};
window.renderCpLeaderboard=function(rows,period){const mapped=(Array.isArray(rows)?rows:[]).map(r=>({a:{id:r.userA?.id,name:r.userA?.displayName||r.userA?.username,avatar:r.userA?.avatarUrl},b:{id:r.userB?.id,name:r.userB?.displayName||r.userB?.username,avatar:r.userB?.avatarUrl},score:period==="world"?(r.points||0):(r.weeklyPoints||0),days:r.days||0}));if(period==="world")data.weekly.world=mapped;else{data.weekly.leaderboard=mapped;if(mapped.length){data.weekly.featured={...mapped[0],score:mapped[0].score};}}render();};
window.renderCpRewards=function(groups){data.rewards=(Array.isArray(groups)?groups:[]).flatMap(g=>(Array.isArray(g.levels)?g.levels:[]).map(l=>({title:(g.type||"CP")+" · المستوى "+(l.level||1),description:"النقاط المطلوبة: "+(l.pointsRequired||0)+(l.reward?" · المكافأة: "+l.reward:"")})));render();};
window.renderCpDiscover=function(rows){window.renderCpLeaderboard(rows, "world");};
window.renderCpCatalog=function(){};
window.renderCpTasks=function(){};
window.showCpMessage=toast;window.showCpError=m=>toast(m||"حدث خطأ");
window.setCpView=function(view){if(view==="home"||view==="weekly")page("weekly");else if(view==="incoming"||view==="sent"||view==="send")page("relationship");else if(view==="discover"){page("weekly");document.querySelector('[data-tab="world"]').click();}else if(view==="rules")page("rules");else page("relationship");};
window.getCpView=()=> $("weekly").classList.contains("hidden")?(!$("relationship").classList.contains("hidden")?"relationship":"rules"):"home";\nwindow.CPPage={reload:function(){if(window.JehoCP){JehoCP.loadHome();JehoCP.loadRequests();JehoCP.loadLeaderboard("weekly");JehoCP.loadLeaderboard("world");JehoCP.loadRewards();}},go:page};
render();
window.addEventListener("load",()=>{if(window.JehoCP){JehoCP.loadHome();JehoCP.loadRequests();JehoCP.loadLeaderboard("weekly");JehoCP.loadLeaderboard("world");JehoCP.loadRewards();}});
</script>
</body>
</html>
