<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111321">
<title>متجر JEHO</title>
<style>
:root{color-scheme:dark;--bg:#0d1020;--panel:#171b2e;--panel2:#20253b;--line:#303650;--gold:#ffd782;--gold2:#f5ad4f;--pink:#ff78ac;--text:#f8f7ff;--muted:#aab0c8;--green:#62e2bd}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Arabic",sans-serif;overflow-x:hidden}body{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:default}
.app{min-height:100vh;background:radial-gradient(ellipse at 50% -12%,#49305c 0,transparent 42%),linear-gradient(180deg,#111426,#0d1020 65%);padding-top:env(safe-area-inset-top)}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:12px 15px;background:#111426ed;border-bottom:1px solid #ffffff12;backdrop-filter:blur(18px)}
.brandmark{width:43px;height:43px;flex:none;display:grid;place-items:center;border-radius:15px;background:linear-gradient(145deg,#ffdb8a,#f5a84f);color:#38203b;font-weight:950;font-size:20px;box-shadow:0 7px 22px #f5ad4f2b}
.brand{flex:1;min-width:0}.brand h1{font-size:18px;line-height:1.2;margin:0;font-weight:900}.brand p{font-size:11px;color:var(--muted);margin:4px 0 0}
.icon-action{min-height:39px;border:1px solid #ffffff17;border-radius:13px;background:#ffffff08;color:#f5d895;padding:0 11px;font-size:12px;font-weight:800;white-space:nowrap}.icon-action.primary{background:linear-gradient(135deg,#ffdb8a,#f5a84f);border:0;color:#32213b}
main{max-width:900px;margin:0 auto;padding:13px 13px 28px}
.hero{position:relative;overflow:hidden;min-height:122px;border-radius:25px;padding:19px 18px;margin-bottom:15px;border:1px solid #ffffff18;background:linear-gradient(115deg,#302047 0%,#4a2c57 47%,#8b4c67 100%);box-shadow:0 16px 40px #0002}
.hero:before{content:"";position:absolute;width:175px;height:175px;border-radius:50%;background:#ffda8c20;left:-46px;top:-86px}.hero:after{content:"✦";position:absolute;left:26px;bottom:-27px;font-size:100px;color:#ffe4a21c;transform:rotate(-12deg)}
.hero-kicker{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:20px;background:#ffffff12;border:1px solid #ffffff20;color:#ffe0a0;font-size:10px;font-weight:800;position:relative;z-index:1}
.hero h2{font-size:22px;line-height:1.35;margin:10px 0 5px;position:relative;z-index:1;font-weight:900}.hero p{font-size:12px;color:#f1dceb;margin:0;position:relative;z-index:1;max-width:80%;line-height:1.7}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:17px 2px 10px}.section-head h3{font-size:15px;margin:0;font-weight:850}.section-head span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 9px;scrollbar-width:none;overscroll-behavior-x:contain}.tabs::-webkit-scrollbar{display:none}.tab{flex:none;border:1px solid #ffffff16;background:#ffffff07;color:#bdc2d7;border-radius:14px;padding:10px 14px;font-size:12px;font-weight:800;white-space:nowrap;transition:background .18s,transform .18s}.tab:active{transform:scale(.97)}.tab.active{color:#2e2036;background:linear-gradient(135deg,#ffe29c,#f5ae56);border-color:transparent;box-shadow:0 7px 20px #f5ad4f22}
.filters{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:3px 1px 12px}.count{color:var(--muted);font-size:11px}.mode{padding:7px 10px;border-radius:11px;background:#ffffff0a;border:1px solid #ffffff14;color:#d8dbee;font-size:11px;font-weight:750}.mode.active{color:var(--gold);border-color:#ffd78255;background:#ffd78210}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.product{min-width:0;overflow:hidden;position:relative;border-radius:20px;border:1px solid #ffffff13;background:linear-gradient(155deg,#1d2237,#15192b 82%);box-shadow:0 10px 25px #00018;transition:border-color .18s,transform .18s}.product.selected{border-color:#ffd782aa;box-shadow:0 0 0 1px #ffd78226,0 12px 26px #0002}.product:active{transform:scale(.99)}
.preview{height:136px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#3d3157,#1b2034 72%);border-bottom:1px solid #ffffff0c;cursor:pointer}.preview:before{content:"";position:absolute;inset:0;background:linear-gradient(145deg,#ffffff08,transparent 55%);pointer-events:none}.preview img,.preview video{width:100%;height:100%;object-fit:contain;padding:9px;position:relative;z-index:1}.preview .fallback{display:flex;flex-direction:column;align-items:center;gap:8px;color:#8d94b4;font-size:11px}.fallback .gem{font-size:34px;filter:drop-shadow(0 4px 12px #ffcf7950)}
.tag{position:absolute;z-index:2;top:8px;right:8px;padding:5px 8px;border-radius:9px;font-size:9px;font-weight:850;background:#101426d9;border:1px solid #ffffff1c;color:#ffdfa0;backdrop-filter:blur(8px)}.tag.owned{color:#8af0ce}.tag.vip{color:#ff9fcb}.play-chip{position:absolute;z-index:3;bottom:8px;left:8px;background:#0b0e1ad9;border:1px solid #ffffff22;border-radius:10px;color:white;padding:5px 8px;font-size:10px;font-weight:800}
.product-body{padding:11px 10px 10px}.product h4{font-size:13px;line-height:1.5;margin:0 0 4px;min-height:38px;font-weight:850;overflow-wrap:anywhere}.desc{font-size:10px;line-height:1.6;color:var(--muted);min-height:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price-row{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:10px 0 9px}.price{font-size:12px;font-weight:900;color:var(--gold);white-space:nowrap}.period{font-size:9px;color:#aeb4cc;white-space:nowrap}
.actions{display:grid;grid-template-columns:1fr;gap:6px}.btn{width:100%;min-height:37px;border-radius:12px;font-size:11px;font-weight:850;transition:filter .15s,transform .15s}.btn:active{transform:scale(.98)}.btn.buy{background:linear-gradient(135deg,#ffe29b,#f2ad55);color:#302039}.btn.equip{background:#6be1bd18;color:#83efd0;border:1px solid #6be1bd4a}.btn.equipped{background:#ffd78214;color:#ffdc8e;border:1px solid #ffd7824a}.btn.preview-btn{background:#ffffff09;color:#d6daec;border:1px solid #ffffff14}.btn.locked{background:#ffffff09;color:#c0c4d8;border:1px solid #ffffff17}
.empty{grid-column:1/-1;text-align:center;padding:38px 16px;border:1px dashed #ffffff22;border-radius:20px;background:#ffffff04}.empty .symbol{font-size:34px}.empty h4{margin:8px 0 4px}.empty p{font-size:12px;color:var(--muted);margin:0}
.preview-sheet{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:18px;background:#050711d9;backdrop-filter:blur(10px)}.preview-sheet.open{display:flex}.sheet-card{width:min(100%,440px);max-height:85vh;overflow:auto;border:1px solid #ffffff1c;border-radius:24px;background:#171b2d;box-shadow:0 24px 80px #0008;padding:14px}.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}.sheet-head strong{flex:1;font-size:15px}.close{width:38px;height:38px;border-radius:12px;background:#ffffff10;color:white;font-size:20px}.sheet-media{min-height:210px;max-height:54vh;border-radius:16px;background:#0c1020;display:grid;place-items:center;overflow:hidden}.sheet-media img,.sheet-media video{display:block;width:100%;max-height:54vh;object-fit:contain}.sheet-note{color:var(--muted);font-size:11px;line-height:1.7;margin:10px 2px 0}
.toast{position:fixed;z-index:50;bottom:calc(16px + env(safe-area-inset-bottom));right:50%;transform:translateX(50%) translateY(20px);opacity:0;pointer-events:none;background:#292e43;border:1px solid #ffffff1c;color:#fff;padding:11px 16px;border-radius:14px;font-size:12px;box-shadow:0 10px 30px #0006;transition:all .22s;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(50%) translateY(0)}
.loading{grid-column:1/-1;text-align:center;padding:35px;color:var(--muted);font-size:12px}.loading:before{content:"";display:block;width:24px;height:24px;border:2px solid #ffffff20;border-top-color:var(--gold);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:600px){main{padding:20px 20px 34px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.preview{height:158px}.hero{padding:24px 24px}.hero h2{font-size:25px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brandmark">J</div>
 <div class="brand"><h1 id="pageTitle">متجر المظهر</h1><p>اختَر لمستك الخاصة ✦</p></div>
 <button class="icon-action" id="bagButton" onclick="toggleBag()">مقتنياتي</button>
 <button class="icon-action primary" onclick="recharge()">＋ شحن</button>
</header>
<main>
 <section class="hero">
  <span class="hero-kicker">✦ JEHO EXCLUSIVE</span>
  <h2 id="heroTitle">خلّي حضورك يلفت الأنظار</h2>
  <p id="heroSubtitle">إطارات متألقة، دخوليات مميزة، وتفاصيل تعكس أسلوبك.</p>
 </section>
 <div class="section-head"><h3>تصفّح الأقسام</h3><span>اسحب أفقيًا ←</span></div>
 <nav class="tabs" id="tabs" aria-label="أقسام المتجر">
  <button class="tab active" data-type="vip_badge" onclick="chooseType('vip_badge')">✧ الإطارات</button>
  <button class="tab" data-type="entry_effect" onclick="chooseType('entry_effect')">✦ الدخوليات</button>
  <button class="tab" data-type="level_badge" onclick="chooseType('level_badge')">⬡ الشارات</button>
  <button class="tab" data-type="room_card" onclick="chooseType('room_card')">▧ بطاقات الغرف</button>
  <button class="tab" data-type="room_background" onclick="chooseType('room_background')">▤ خلفيات الغرف</button>
 </nav>
 <div class="filters"><span class="count" id="count">جارٍ تحميل المنتجات…</span><button class="mode" id="modeButton" onclick="toggleBag()">عرض مقتنياتي</button></div>
 <section class="grid" id="grid"><div class="loading">جارٍ تحميل المتجر</div></section>
</main>
</div>
<div class="preview-sheet" id="previewSheet" role="dialog" aria-modal="true" aria-label="معاينة المنتج" onclick="closePreviewFromBackdrop(event)">
 <div class="sheet-card"><div class="sheet-head"><strong id="previewTitle">معاينة المنتج</strong><button class="close" onclick="closePreview()" aria-label="إغلاق المعاينة">×</button></div><div class="sheet-media" id="previewMedia"></div><p class="sheet-note" id="previewNote">معاينة الوسيط قبل الشراء</p><button class="btn buy" id="previewBuy" onclick="buySelected()" style="margin-top:12px">شراء المنتج</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const TYPES=[
 {id:'vip_badge',label:'الإطارات',icon:'✧',title:'إطارات تميّز حضورك'},
 {id:'entry_effect',label:'الدخوليات',icon:'✦',title:'دخولية لا تُنسى'},
 {id:'level_badge',label:'الشارات',icon:'⬡',title:'أظهر إنجازاتك'},
 {id:'room_card',label:'بطاقات الغرف',icon:'▧',title:'خلّ غرفتك مميزة'},
 {id:'room_background',label:'خلفيات الغرف',icon:'▤',title:'أجواء على ذوقك'}
];
let activeType='vip_badge',bagMode=false,items=[],selected=null,toastTimer=null;
const $=id=>document.getElementById(id);
function bridge(){return window.JEHOStore||null}
function callNative(name,...args){try{const b=bridge();if(b&&typeof b[name]==='function')b[name](...args);else showToast('هذه الوظيفة تحتاج الاتصال بالتطبيق')}catch(e){showToast('تعذّر تنفيذ العملية، حاول مجددًا')}}
function safeText(value){return String(value??'')}
function mediaKind(url){const u=safeText(url).split('?')[0].toLowerCase();if(/\.svga$/.test(u))return 'svga';if(/\.(mp4|webm|mov|m4v|m3u8)$/.test(u))return 'video';if(/\.(gif|webp|apng)$/.test(u))return 'animated';if(/\.(png|jpe?g|avif|bmp)$/.test(u))return 'image';return 'unknown'}
function esc(value){return safeText(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function absolute(url){const s=safeText(url).trim();if(!s)return '';if(/^(https?:|data:|blob:)/i.test(s))return s;return s}
function motion(item){const a=item?.animationUrl||'',p=item?.previewUrl||'';if(['video','animated','svga'].includes(mediaKind(a)))return a;if(['video','animated','svga'].includes(mediaKind(p)))return p;return a||p}
function still(item){const p=item?.previewUrl||'',a=item?.animationUrl||'';if(p && mediaKind(p)==='image')return p;if(a&&mediaKind(a)==='image')return a;if(p&&mediaKind(p)==='animated')return p;if(a&&mediaKind(a)==='animated')return a;return p||a}
function chooseType(type){if(!TYPES.some(t=>t.id===type))return;activeType=type;selected=null;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.type===type));const t=TYPES.find(x=>x.id===type);$('heroTitle').textContent=t.title;$('heroSubtitle').textContent='معاينة مباشرة للمنتجات، مع شراء وارتداء من حسابك.';$('count').textContent='جارٍ تحميل المنتجات…';$('grid').innerHTML='<div class="loading">جارٍ تحميل القسم</div>';callNative('selectType',type)}
function toggleBag(){bagMode=!bagMode;$('bagButton').textContent=bagMode?'كل المتجر':'مقتنياتي';$('modeButton').textContent=bagMode?'عرض كل المتجر':'عرض مقتنياتي';$('modeButton').classList.toggle('active',bagMode);$('pageTitle').textContent=bagMode?'مقتنياتي':'متجر المظهر';callNative('setBagMode',bagMode);callNative('selectType',activeType)}
function recharge(){callNative('recharge')}
function selectItem(id){selected=items.find(x=>x.id===id)||null;if(!selected)return;render();callNative('select',id)}
function buy(id){const item=items.find(x=>x.id===id);if(!item)return;selected=item;callNative('purchase',id)}
function equip(id){callNative('equip',id)}
function unequip(id){callNative('unequip',id)}
function preview(id){const item=items.find(x=>x.id===id);if(!item)return;selected=item;$('previewTitle').textContent=item.name||'معاينة المنتج';$('previewNote').textContent=item.description||'معاينة المنتج قبل الشراء أو الارتداء.';const media=motion(item),kind=mediaKind(media);let markup='';if(kind==='video'){markup='<video src="'+esc(absolute(media))+'" controls autoplay loop playsinline preload="metadata"></video>'}else if(kind==='image'||kind==='animated'){markup='<img src="'+esc(absolute(media))+'" alt="'+esc(item.name)+'">'}else if(kind==='svga'){const thumb=still(item);markup=thumb?'<img src="'+esc(absolute(thumb))+'" alt="'+esc(item.name)+'">':'<div class="fallback"><span class="gem">✧</span><span>معاينة حركة SVGA</span></div>';$('previewNote').textContent='ملف الحركة SVGA؛ معاينته الحركية تعتمد على مشغّل التطبيق.'}else{markup='<div class="fallback"><span class="gem">✧</span><span>لا توجد معاينة متاحة</span></div>'}
$('previewMedia').innerHTML=markup;$('previewBuy').textContent=item.owned?(item.equipped?'تم الارتداء':'ارتداء المنتج'):'شراء · '+(Number(item.coinPrice)>0?Number(item.coinPrice).toLocaleString('ar')+' عملة':'مجاني');$('previewBuy').onclick=()=>{if(item.owned){item.equipped?unequip(item.id):equip(item.id)}else buy(item.id)};$('previewSheet').classList.add('open');callNative('select',id)}
function closePreview(){$('previewSheet').classList.remove('open');$('previewMedia').querySelectorAll('video').forEach(v=>{try{v.pause();v.removeAttribute('src');v.load()}catch(e){}});$('previewMedia').innerHTML=''}
function closePreviewFromBackdrop(e){if(e.target===$('previewSheet'))closePreview()}
function showToast(message){const el=$('toast');el.textContent=safeText(message);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function render(){const list=items.filter(i=>!bagMode||i.owned);$('count').textContent=list.length+' منتج'+(bagMode?' في مقتنياتك':' في هذا القسم');if(!list.length){$('grid').innerHTML='<div class="empty"><div class="symbol">✧</div><h4>'+(bagMode?'لا توجد مقتنيات في هذا القسم':'لا توجد منتجات في هذا القسم')+'</h4><p>'+(bagMode?'اقتَنِ منتجًا وسيظهر هنا.':'جرّب قسمًا آخر أو عُد لاحقًا.')+'</p></div>';return}
$('grid').innerHTML=list.map(item=>{const m=motion(item),kind=mediaKind(m),thumb=still(item);let media='';if(kind==='video'){media=thumb&&mediaKind(thumb)!=='video'?'<img src="'+esc(absolute(thumb))+'" alt="">':'<div class="fallback"><span class="gem">▶</span><span>فيديو</span></div>'}else if(kind==='svga'){media=thumb?'<img src="'+esc(absolute(thumb))+'" alt="'+esc(item.name)+'">':'<div class="fallback"><span class="gem">✧</span><span>حركة SVGA</span></div>'}else if(thumb){media='<img src="'+esc(absolute(thumb))+'" alt="'+esc(item.name)+'" loading="lazy">'}else{media='<div class="fallback"><span class="gem">✧</span><span>معاينة غير متاحة</span></div>'}
let tag=item.owned?'<span class="tag owned">'+(item.equipped?'✓ مُرتدى':'✓ في مقتنياتي')+'</span>':(Number(item.minVipLevel)>0?'<span class="tag vip">VIP '+Number(item.minVipLevel)+'</span>':'<span class="tag">JEHO EXCLUSIVE</span>');
let price=item.owned?(item.daysLeft>0?'متبقي '+item.daysLeft+' يوم':'ملكية دائمة'):(Number(item.coinPrice)>0?Number(item.coinPrice).toLocaleString('ar')+' عملة':'مجاني');
let button=item.owned?'<button class="btn '+(item.equipped?'equipped':'equip')+'" onclick="event.stopPropagation();'+(item.equipped?'unequip':'equip')+'(\''+esc(item.id)+'\')">'+(item.equipped?'✓ تم الارتداء · إزالة':'ارتداء الآن')+'</button>':'<button class="btn buy" onclick="event.stopPropagation();buy(\''+esc(item.id)+'\')">شراء الآن</button>';
return '<article class="product '+(selected&&selected.id===item.id?'selected':'')+'" onclick="selectItem(\''+esc(item.id)+'\')"><div class="preview" onclick="event.stopPropagation();preview(\''+esc(item.id)+'\')">'+tag+media+((kind==='video'||kind==='svga'||kind==='animated')?'<button class="play-chip" onclick="event.stopPropagation();preview(\''+esc(item.id)+'\')">▶ معاينة</button>':'')+'</div><div class="product-body"><h4>'+esc(item.name||item.code||'منتج JEHO')+'</h4><div class="desc">'+esc(item.description||'تميّز بإطلالة فريدة داخل JEHO')+'</div><div class="price-row"><span class="price">'+esc(price)+'</span><span class="period">'+(!item.owned&&Number(item.coinPrice)>0?'30 يومًا':'')+'</span></div><div class="actions">'+button+'<button class="btn preview-btn" onclick="event.stopPropagation();preview(\''+esc(item.id)+'\')">معاينة التفاصيل</button></div></div></article>'}).join('')}
window.mallRender=function(payload){try{const data=typeof payload==='string'?JSON.parse(payload):payload;items=Array.isArray(data?.items)?data.items:[];if(data?.type&&TYPES.some(t=>t.id===data.type)){activeType=data.type;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.type===activeType))}if(selected){selected=items.find(i=>i.id===selected.id)||null}render()}catch(e){showToast('تعذّر تحديث بيانات المتجر')}};
window.mallMessage=function(message){showToast(message)};
window.mallError=function(message){showToast(message)};
window.addEventListener('keydown',e=>{if(e.key==='Escape')closePreview()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)$('previewMedia').querySelectorAll('video').forEach(v=>{try{v.pause()}catch(e){}})});
window.addEventListener('load',()=>{callNative('ready')});
</script>
</body>
</html>
