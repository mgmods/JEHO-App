# LiveKit signaling (WebSocket) for voice.adastra.bbs.tr
# Media remains direct: UDP 50000-50100 + TCP 7881 on host.

server {
    listen 80;
    listen [::]:80;
    server_name voice.adastra.bbs.tr;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/java_node_ssl;
        default_type text/plain;
    }

    location / {
        # Proxy HTTP too (Cloudflare Flexible SSL must NOT force 301→https or it loops).
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        proxy_buffering off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voice.adastra.bbs.tr;

    # Paths filled by certbot / panel (see scripts/setup_livekit_domain.py)
    ssl_certificate     /www/server/panel/vhost/cert/voice.adastra.bbs.tr/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/voice.adastra.bbs.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 0;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
