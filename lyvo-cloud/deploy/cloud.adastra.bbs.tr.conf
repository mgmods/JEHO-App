# LiveKit stays on voice.adastra.bbs.tr only.
# This vhost is LYVO Cloud console — separate process :3910

server {
    listen 80;
    listen [::]:80;
    server_name cloud.adastra.bbs.tr;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/java_node_ssl;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.adastra.bbs.tr;

    ssl_certificate     /www/server/panel/vhost/cert/cloud.adastra.bbs.tr/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cloud.adastra.bbs.tr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
