<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="gifts/gifts.css">
  <link rel="stylesheet" href="join-toasts/join-toasts.css">
  <link rel="stylesheet" href="host-frames/styles.css">
  <style>
    html:root,body{width:100%;height:100%;margin:0;background-color:transparent!important;background-image:none!important;overflow:hidden}
    html::before,html::after,body::before,body::after{display:none!important;background:none!important}
    #host-layer{position:fixed;inset:0;display:none;place-items:center;pointer-events:none}
    #host-layer.is-visible{display:grid}
    #host-signal{width:min(520px,88vw);aspect-ratio:1}
  </style>
</head>
<body>
  <div id="host-layer"><div id="host-signal"></div></div>
  <script src="gifts/gifts.js"></script>
  <script src="join-toasts/join-toasts.js"></script>
  <script src="host-frames/signal.js"></script>
  <script>
    (() => {
      "use strict";
      const hostLayer = document.querySelector("#host-layer");
      let hostTimer;
      const parse = (value) => typeof value === "string" ? JSON.parse(value) : (value || {});
      const later = (callback, duration, minimum) =>
        window.setTimeout(callback, Math.max(minimum, Number(duration) || minimum));
      const effectCallbacks = () => ({
        onStart: () => window.AndroidEffects?.onEffectStarted?.(),
        onComplete: () => window.AndroidEffects?.onEffectCompleted?.()
      });

      function joinVariant(payload) {
        if (payload.variant) return payload.variant;
        const vip = Number(payload.vipLevel || 0);
        if (payload.supporterTier === "supporter" || payload.supporterTier === "legendary") return "supporter";
        if (vip >= 9) return "legend";
        if (vip >= 6) return "diamond";
        if (vip >= 3) return "gold";
        if (vip >= 1) return "vip";
        return "normal";
      }

      const api = {
        gift(value) {
          return Gifts.show({
            ...parse(value),
            ...effectCallbacks(),
            assetBase: "gifts/assets",
            spriteBase: "gifts/sprites",
            audioBase: "gifts/audio"
          });
        },
        entryEffect(value) {
          const payload = parse(value);
          return JoinToasts.show({
            ...payload,
            ...effectCallbacks(),
            variant: joinVariant(payload),
            message: payload.title || payload.message || "دخل إلى الغرفة"
          });
        },
        joinToast(value) {
          const payload = parse(value);
          return JoinToasts.show({
            ...payload,
            ...effectCallbacks(),
            variant: joinVariant(payload)
          });
        },
        hostFrame(value) {
          const payload = parse(value);
          clearTimeout(hostTimer);
          hostLayer.classList.add("is-visible");
          HostFrames.render("#host-signal", {
            ...payload,
            assetBase: "host-frames/assets"
          });
          if (!payload.persistent) {
            hostTimer = later(() => hostLayer.classList.remove("is-visible"), payload.duration, 4200);
          }
        },
        stopAll() {
          Gifts.stop?.();
          JoinToasts.stop?.();
          clearTimeout(hostTimer);
          hostLayer.classList.remove("is-visible");
        }
      };

      window.VisualEffects = api;
      window.playVisualEffect = (type, payload) => {
        if (typeof api[type] !== "function") throw new Error(`Unknown effect type: ${type}`);
        return api[type](payload);
      };
      window.addEventListener("message", (event) => {
        if (event.source !== window.parent || event.data?.source !== "jeho-dashboard") return;
        window.playVisualEffect(event.data.type, event.data.payload || {});
      });
      window.AndroidEffects?.onReady?.();
    })();
  </script>
</body>
</html>
