<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>ذاكرة الحب · AuraLive</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(160deg,#2a1020,#120810);color:#ffe8f0;font-family:Tahoma,Arial,sans-serif;padding:18px}
h1{text-align:center;margin:8px 0 16px}
.badge-row{display:flex;gap:8px;justify-content:center;margin-bottom:10px;min-height:36px}
.aura-badge{display:none;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,214,120,.45);font-size:18px}
.aura-badge.on{display:inline-flex}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto}
.card{aspect-ratio:1;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,180,200,.25);display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;user-select:none}
.card.open,.card.done{background:linear-gradient(145deg,#ff6b9d,#a11852)}
#status{text-align:center;margin-top:16px;opacity:.9}
</style>
</head>
<body>
<h1>ذاكرة الحب</h1>
<div class="badge-row"><span class="aura-badge" id="stampBadge"></span><span class="aura-badge" id="emojiBadge"></span></div>
<div class="grid" id="grid"></div>
<div id="status">طابق القلوب والهدايا</div>
<script>
const icons=['❤️','🌹','👑','💎','🎵','🎁','⭐','🔥'];
let deck=[...icons,...icons].sort(()=>Math.random()-0.5);
let first=null,lock=false,matched=0;
const grid=document.getElementById('grid');
deck.forEach((icon,i)=>{
  const el=document.createElement('div');
  el.className='card'; el.dataset.v=icon; el.dataset.i=i; el.textContent='❔';
  el.onclick=()=>{
    if(lock||el.classList.contains('open')||el.classList.contains('done'))return;
    el.classList.add('open'); el.textContent=icon;
    if(!first){first=el;return;}
    lock=true;
    if(first.dataset.v===icon){
      first.classList.add('done'); el.classList.add('done'); first=null; lock=false; matched++;
      if(matched===icons.length) document.getElementById('status').textContent='أحسنت! أكملت اللعبة 🎉';
    } else {
      const a=first,b=el; setTimeout(()=>{a.classList.remove('open');b.classList.remove('open');a.textContent='❔';b.textContent='❔';first=null;lock=false;},650);
    }
  };
  grid.appendChild(el);
});
const STAMPS={stamp_heart:'💖',stamp_crown:'👑',stamp_vip:'⭐'};
const EMOJIS={emoji_laugh:'😂',emoji_fire:'🔥',emoji_crown:'👑'};
function setBadge(el,text){ if(!el)return; if(text){el.textContent=text;el.classList.add('on');}else{el.textContent='';el.classList.remove('on');} }
window.applyAuraCosmetics=function(c){
  c=c||window.__AURA_COSMETICS__||{};
  setBadge(document.getElementById('stampBadge'), STAMPS[c.stamp]||'');
  setBadge(document.getElementById('emojiBadge'), EMOJIS[c.emoji]||'');
  if(c.tiles==='tile_rose') document.querySelectorAll('.card').forEach(el=>el.style.borderColor='rgba(233,30,140,.5)');
  if(c.tiles==='tile_royal') document.querySelectorAll('.card').forEach(el=>el.style.borderColor='rgba(155,89,182,.5)');
};
if(window.__AURA_COSMETICS__) window.applyAuraCosmetics(window.__AURA_COSMETICS__);
</script>
</body>
</html>
