name: jeho_own_flutter
description: JEHO-OWN Flutter client migrated from the original Android app.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  file_picker: ^10.3.10
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/original/icons/
    - assets/original/lottie/
    - assets/original/visual-system/gifts/assets/
    - assets/original/visual-system/host-frames/assets/
    - assets/original/android-res/drawable-hdpi/
    - assets/original/android-res/drawable-ldrtl-xxhdpi/
    - assets/original/android-res/drawable-mdpi/
    - assets/original/android-res/drawable-nodpi/
    - assets/original/android-res/drawable-xhdpi/
    - assets/original/android-res/drawable-xxhdpi/
    - assets/original/android-res/drawable-xxxhdpi/
    - assets/original/android-res/drawable/
    - assets/original/android-res/mipmap-hdpi/
    - assets/original/android-res/mipmap-mdpi/
    - assets/original/android-res/mipmap-xhdpi/
    - assets/original/android-res/mipmap-xxhdpi/
    - assets/original/android-res/mipmap-xxxhdpi/
