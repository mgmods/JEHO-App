name: Flutter Client Checks

on:
  pull_request:
    branches: [jeho-own]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-client-checks.yml"
  push:
    branches: [feat/flutter-foundation-2026-10-13]
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-client-checks.yml"

permissions:
  contents: read

# Keep only the newest validation for this branch/PR; stale queued builds are wasteful.
concurrency:
  group: flutter-client-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Generate only the missing Android platform scaffold in the CI workspace.
      # No production Android files are changed or overwritten.
      - name: Generate Android platform scaffold
        run: flutter create --platforms=android --project-name jeho_own_flutter --org com.jehoown .

      # file_picker / flutter_plugin_android_lifecycle currently require Android API 36.
      # Only the generated CI scaffold is changed; no production Android files are overwritten.
      - name: Set Android compile SDK
        shell: bash
        run: |
          if [[ -f android/app/build.gradle.kts ]]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          elif [[ -f android/app/build.gradle ]]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
          else
            echo "Android app Gradle file not found" >&2
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Widget tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=JEHO_API_BASE_URL=https://jeho-own-backend.mgs.blitz.cloud/api/v1/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jeho-own-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
