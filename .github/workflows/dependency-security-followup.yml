name: JEHO dependency security follow-up

on:
  push:
    branches:
      - security/dependency-audit-followup-20261120
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeho-security-followup
  cancel-in-progress: false

jobs:
  remediate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jeho_test
          POSTGRES_PASSWORD: jeho_test_password
          POSTGRES_DB: jeho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeho_test -d jeho_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout isolated security branch
        uses: actions/checkout@v4
        with:
          ref: security/dependency-audit-followup-20261120
          persist-credentials: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            backend/dashboard/package-lock.json

      - name: Apply non-breaking backend advisory fixes
        working-directory: backend
        run: npm audit fix --no-fund --no-progress

      - name: Apply non-breaking dashboard advisory fixes
        working-directory: backend/dashboard
        run: npm audit fix --no-fund --no-progress

      - name: Validate backend clean install
        working-directory: backend
        run: npm ci

      - name: Validate dashboard clean install
        working-directory: backend/dashboard
        run: npm ci

      - name: Backend TypeScript validation
        working-directory: backend
        run: npm run lint

      - name: Backend games regression tests
        working-directory: backend
        run: npm run test:games

      - name: CP PostgreSQL fresh-install and upgrade tests
        working-directory: backend
        env:
          CP_TEST_DATABASE_URL: postgresql://jeho_test:jeho_test_password@localhost:5432/jeho_test
        run: npm run test:cp-bootstrap

      - name: Backend production build
        working-directory: backend
        run: npm run build

      - name: Dashboard production build
        working-directory: backend/dashboard
        env:
          VITE_API_URL: /api/v1
          VITE_BASE: /admin/
        run: npm run build

      - name: Generate final audit reports and enforce zero findings
        if: always()
        shell: bash
        run: |
          mkdir -p security-audit-results
          (cd backend && npm audit --json > ../security-audit-results/backend-audit.json) || true
          (cd backend/dashboard && npm audit --json > ../../security-audit-results/dashboard-audit.json) || true
          node <<'NODE'
          const fs = require('fs');
          let failed = false;
          for (const name of ['backend', 'dashboard']) {
            const path = `security-audit-results/${name}-audit.json`;
            let report = {};
            try { report = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
            const v = report.metadata?.vulnerabilities || {};
            const row = `| ${name} | ${v.total ?? 'unknown'} | ${v.low ?? 0} | ${v.moderate ?? 0} | ${v.high ?? 0} | ${v.critical ?? 0} |`;
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, row + '\\n');
            if (v.total !== 0) failed = true;
          }
          if (failed) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '\\nSecurity findings remain. No lockfile changes will be promoted by this workflow.\\n');
            process.exitCode = 1;
          }
          NODE
        env:
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}

      - name: Upload audit reports and proposed lockfile diff
        if: always()
        shell: bash
        run: |
          git diff -- backend/package.json backend/package-lock.json backend/dashboard/package.json backend/dashboard/package-lock.json > security-audit-results/lockfile-diff.patch || true
        continue-on-error: true

      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeho-security-followup-evidence
          path: security-audit-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit verified dependency fixes only when all audits and tests pass
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+mgmods@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json backend/dashboard/package.json backend/dashboard/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were required."
          else
            git commit -m "fix(security): apply verified non-breaking dependency updates"
            git push origin HEAD:security/dependency-audit-followup-20261120
          fi
