# The isolated branch publishes only a badge-fix tag; it never overwrites production tags.
name: Publish JEHO-OWN backend image

on:
  push:
    branches:
      - jeho-own
      - jeho-own-stability-badges-fix-20261015
    paths:
      - "backend/**"
      - ".github/workflows/publish-jeho-own-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-jeho-own-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-production:
    if: github.ref == 'refs/heads/jeho-own'
    runs-on: ubuntu-latest
    steps:
      - name: Check out JEHO-OWN branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish production backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:jeho-own
            ghcr.io/mgmods/jeho-own-backend:sha-${{ github.sha }}

  build-and-publish-isolated-fix:
    if: github.ref == 'refs/heads/jeho-own-stability-badges-fix-20261015'
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated badge-fix branch
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish isolated badge-fix backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:badge-fix-${{ github.sha }}
