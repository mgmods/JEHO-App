name: Build JEHOO test APK and Ghaymah backend image

on:
  push:
    branches: [admin-isolated-test]
    paths:
      - "android/**"
      - "backend/**"
      - ".github/workflows/build-jehoo-test-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jehoo-test-release
  cancel-in-progress: false

jobs:
  backend-image:
    name: Build and publish Ghaymah candidate image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend plus admin dashboard
        id: image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:jehoo-test-${{ github.sha }}
            ghcr.io/mgmods/jeho-own-backend:jehoo-test-latest
          labels: |
            org.opencontainers.image.source=https://github.com/mgmods/JEHO-App
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record immutable image digest
        run: |
          echo "Image: ghcr.io/mgmods/jeho-own-backend@${{ steps.image.outputs.digest }}" | tee image-reference.txt

      - name: Upload image reference
        uses: actions/upload-artifact@v4
        with:
          name: jehoo-ghaymah-image-reference
          path: image-reference.txt
          if-no-files-found: error
          retention-days: 30

  android-apk:
    name: Build signed JEHOO test APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JEHO_OWN_API_URL: https://jeho-own-web-910481ae.hosted.cumin.dev
      JEHO_DEBUG_KEYSTORE: ${{ github.workspace }}/jehoo-test-release.jks
      JEHO_DEBUG_STORE_PASSWORD: ${{ secrets.JEHOO_TEST_KEYSTORE_PASSWORD }}
      JEHO_DEBUG_KEY_PASSWORD: ${{ secrets.JEHOO_TEST_KEY_PASSWORD }}
      JEHO_DEBUG_KEY_ALIAS: jehoo-test
    steps:
      - name: Checkout isolated candidate
        uses: actions/checkout@v4

      - name: Check signing secret availability
        env:
          KEYSTORE_B64: ${{ secrets.JEHOO_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$JEHO_DEBUG_STORE_PASSWORD" ] || [ -z "$JEHO_DEBUG_KEY_PASSWORD" ]; then
            echo "::error::Add JEHOO_TEST_KEYSTORE_BASE64, JEHOO_TEST_KEYSTORE_PASSWORD, and JEHOO_TEST_KEY_PASSWORD repository secrets before building the signed APK."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$JEHO_DEBUG_KEYSTORE"
          test -s "$JEHO_DEBUG_KEYSTORE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Build signed universal debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug -PJEHO_OWN_API_URL="$JEHO_OWN_API_URL"

      - name: Verify APK package and signing certificate
        run: |
          APK=$(find android/app/build/outputs/apk/debug -type f -name '*universal*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            APK=$(find android/app/build/outputs/apk/debug -type f -name 'app-debug.apk' | head -n 1)
          fi
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.mgwa.chat'"
          CERT_SHA1=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/.*SHA-1 digest: //p' | head -n 1 | tr -d ':')
          test "$CERT_SHA1" = "ec3e9f58a7ba163cdfe5f846427e8df4c0c72ba7"
          echo "Verified APK: $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload JEHOO APK
        uses: actions/upload-artifact@v4
        with:
          name: JEHOO-com-mgwa-chat-test-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
