name: Build and publish MG-JEHO image for Blitz Cloud

on:
  workflow_run:
    workflows: ["JEHO-OWN Backend and Dashboard Checks"]
    types: [completed]
    branches: [MG-JEHO]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Manual rebuild fallback: a branch push runs checks, then workflow_run publishes the exact checked commit.
# Let an active image publish finish; newer queued pushes can then publish next.
# Cancelling during Docker push can leave Blitz's mutable tag pointing at an older image.
concurrency:
  group: build-jeho-own-blitz-image
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the exact commit that passed checks
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend plus dashboard
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:mg-jeho
            ghcr.io/mgmods/jeho-own-backend:badge-fix-8f26b6dc33d198fc5ce695be7bc638658b8693e8
            ghcr.io/mgmods/jeho-own-backend:mg-jeho-${{ github.event.workflow_run.head_sha || github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mgmods/JEHO-App
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=JEHO-OWN backend and dashboard
          cache-from: type=gha
          cache-to: type=gha,mode=max
