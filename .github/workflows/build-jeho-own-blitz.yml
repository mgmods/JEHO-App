name: Legacy JEHO-OWN Blitz image publisher (isolated from MG-JEHO)

on:
  # Deliberately manual and restricted to the legacy branch. MG-JEHO must
  # publish and deploy only through the dedicated Cumin/Ghaymah workflow.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    if: ${{ github.ref_name == 'jeho-own' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out legacy branch
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish legacy branch image only
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:jeho-own
            ghcr.io/mgmods/jeho-own-backend:legacy-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mgmods/JEHO-App
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Legacy JEHO-OWN (Blitz only)
