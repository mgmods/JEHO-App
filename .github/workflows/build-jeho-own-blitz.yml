name: JEHO-OWN Blitz image publisher

on:
  push:
    branches:
      - MG-JEHO
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    if: ${{ github.ref_name == 'MG-JEHO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out current JEHO source
        uses: actions/checkout@v4
        with:
          ref: MG-JEHO
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the current MG-JEHO backend and admin dashboard for Blitz and Cumin
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:mg-jeho
            ghcr.io/mgmods/jeho-own-backend:mg-jeho-${{ github.sha }}
            ghcr.io/mgmods/jeho-own-backend:blitz
            ghcr.io/mgmods/jeho-own-backend:blitz-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mgmods/JEHO-App
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=JEHO-OWN backend and admin dashboard
