name: Optimize JEHO Android drawable assets

on:
  pull_request:
    branches: [MG-JEHO]
    types: [opened, synchronize, reopened]
    paths:
      - "android/app/src/main/res/**"
      - ".github/workflows/optimize-android-drawables.yml"

permissions:
  contents: write

concurrency:
  group: jeho-drawable-optimization-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  optimize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'MG-JEHO-PERFORMANCE-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Install lossless WebP encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Losslessly optimize Android drawable PNGs
        id: optimize
        shell: bash
        run: |
          set -euo pipefail
          converted=0
          saved=0
          while IFS= read -r -d '' source; do
            target="${source%.png}.webp"
            if ! cwebp -quiet -lossless -m 6 -mt -metadata icc "$source" -o "$target"; then
              rm -f "$target"
              continue
            fi
            original_bytes="$(stat -c '%s' "$source")"
            optimized_bytes="$(stat -c '%s' "$target")"
            if (( optimized_bytes < original_bytes )); then
              rm "$source"
              converted=$((converted + 1))
              saved=$((saved + original_bytes - optimized_bytes))
            else
              rm "$target"
            fi
          done < <(find android/app/src/main/res -type f \
            -path '*/drawable*/*' -name '*.png' ! -name '*.9.png' -print0)
          saved_mib="$(awk -v n="$saved" 'BEGIN { printf "%.2f", n/1048576 }')"
          echo "converted=$converted" >> "$GITHUB_OUTPUT"
          echo "saved_mib=$saved_mib" >> "$GITHUB_OUTPUT"
          {
            echo "## Lossless Android drawable optimization"
            echo
            echo "- PNG resources converted to WebP: $converted"
            echo "- Source resource bytes saved: $saved_mib MiB"
            echo "- Nine-patch PNGs were left unchanged."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit optimized drawable resources to the PR branch
        if: ${{ steps.optimize.outputs.converted != '0' }}
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android/app/src/main/res
          if git diff --cached --quiet; then
            echo "No smaller lossless WebP resources were produced."
            exit 0
          fi
          git commit -m "perf(android): losslessly compress drawable resources"
          git push origin "HEAD:${PR_BRANCH}"
