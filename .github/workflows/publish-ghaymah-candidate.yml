name: Build JEHO image for Ghaymah (isolated candidate)

on:
  workflow_run:
    workflows: ["JEHO-OWN Backend and Dashboard Checks"]
    types: [completed]
    branches: [MG-JEHO]

permissions:
  contents: read
  packages: write

concurrency:
  group: jeho-ghaymah-candidate
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact MG-JEHO commit that passed backend, dashboard and Docker checks
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish isolated Ghaymah candidate (backend + Vue admin dashboard)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:ghaymah-candidate
            ghcr.io/mgmods/jeho-own-backend:ghaymah-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mgmods/JEHO-App
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.title=JEHO Ghaymah candidate (backend and dashboard)
          cache-from: type=gha
          cache-to: type=gha,mode=max
