name: Build and deploy JEHO-OWN on Cumin (Ghaymah)

on:
  push:
    branches: [MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: jeho-ghaymah-candidate
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out MG-JEHO
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high || true
      - name: Backend TypeScript check
        working-directory: backend
        run: npm run lint
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Install dashboard dependencies
        working-directory: backend/dashboard
        run: npm ci
      - name: Dashboard dependency audit
        working-directory: backend/dashboard
        run: npm audit --audit-level=high || true
      - name: Build dashboard
        working-directory: backend/dashboard
        env:
          VITE_API_URL: /api/v1
          VITE_BASE: /admin/
        run: npm run build
      - name: Build combined API and dashboard image
        run: docker build --tag jeho-ghaymah-api:ci ./backend

  build-and-publish:
    needs: checks
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact MG-JEHO commit that passed backend, dashboard and Docker checks
        uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish isolated Ghaymah candidate (backend + Vue admin dashboard)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:ghaymah-candidate
            ghcr.io/mgmods/jeho-own-backend:ghaymah-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mgmods/JEHO-App
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=JEHO Ghaymah candidate (backend and dashboard)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-jeho-own:
    needs: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Update only the existing Ghaymah test app image
        env:
          GHAYMAH_API_TOKEN: ${{ secrets.GHAYMAH_API_TOKEN }}
          IMAGE: ghcr.io/mgmods/jeho-own-backend@${{ needs.build-and-publish.outputs.image_digest }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GHAYMAH_API_TOKEN:-}" ]]; then
            echo "::error::GHAYMAH_API_TOKEN is missing."
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # Read the existing app first. Never create an app or change its
          # resources, ports, environment, networking, or attached services.
          status="$(curl --silent --show-error --output "$tmp/apps.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GHAYMAH_API_TOKEN" \
            --header "Accept: application/json" \
            https://api.cumin.dev/apps)"
          if [[ "$status" != "200" ]]; then
            if [[ "$status" == "401" ]]; then
              echo "::error::Cumin returned 401 Unauthorized. Refresh the GHAYMAH_API_TOKEN GitHub Actions secret; no app or image was changed."
            else
              echo "::error::Cumin app lookup failed (HTTP $status); no update was attempted."
            fi
            sed -E 's/(token|secret|password)[^,}]*/\\1=[REDACTED]/Ig' "$tmp/apps.json" || true
            exit 1
          fi

          jq -e '
            if type == "array" then .
            elif (.apps | type) == "array" then .apps
            elif (.data | type) == "array" then .data
            else error("Unrecognized Ghaymah /apps response shape")
            end
            | map(select(.name == "jeho-own"))
          ' "$tmp/apps.json" > "$tmp/matches.json"

          count="$(jq 'length' "$tmp/matches.json")"
          if [[ "$count" != "1" ]]; then
            echo "::error::Expected exactly one visible app named jeho-own; found $count. No update was attempted."
            exit 1
          fi

          jq -e '.[0] | select((.id | type) == "string" and (.id | length) > 0)' \
            "$tmp/matches.json" > "$tmp/current-app.json"

          current_image="$(jq -r '.[0].image // ""' "$tmp/matches.json")"
          echo "Target confirmed: jeho-own. Current image: ${current_image:-unknown}"

          # Preserve the complete app object returned by Ghaymah and change
          # only its image field. Refuse unexpected response formats.
          jq --arg image "$IMAGE" '.[0] | .image = $image' \
            "$tmp/matches.json" > "$tmp/update.json"
          jq -e 'has("id") and .name == "jeho-own" and .image == env.IMAGE' \
            "$tmp/update.json" >/dev/null

          status="$(curl --silent --show-error --output "$tmp/update-response.json" --write-out '%{http_code}' \
            --request PUT \
            --header "Authorization: Bearer $GHAYMAH_API_TOKEN" \
            --header "Content-Type: application/json" \
            --header "Accept: application/json" \
            --data-binary @"$tmp/update.json" \
            https://api.cumin.dev/apps)"
          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Cumin image update failed (HTTP $status). No retry or app creation was attempted."
            sed -E 's/(token|secret|password)[^,}]*/\\1=[REDACTED]/Ig' "$tmp/update-response.json" || true
            exit 1
          fi

          echo "Cumin accepted the exact JEHO-OWN image digest for app jeho-own: $IMAGE"
