name: JEHO-OWN Backend and Dashboard Checks

on:
  push:
    branches: [jeho-own, jeho-own-working-2026-10-05, MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [jeho-own, MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: jeho-checks-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Backend, Dashboard and Docker checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Backend TypeScript check
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: backend/dashboard
        run: npm ci

      - name: Dashboard dependency audit
        working-directory: backend/dashboard
        run: npm audit --audit-level=high || true

      - name: Build dashboard
        working-directory: backend/dashboard
        env:
          VITE_API_URL: /api/v1
          VITE_BASE: /admin/
        run: npm run build

      - name: Build combined API and dashboard image
        run: docker build --tag jeho-own-api:ci ./backend

      # Publish the hosting image from the same checked commit on MG-JEHO.
      # Pull requests only run checks; they never publish an image.
      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/MG-JEHO' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish current MG-JEHO hosting image
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/MG-JEHO' }}
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:mg-jeho
            ghcr.io/mgmods/jeho-own-backend:badge-fix-8f26b6dc33d198fc5ce695be7bc638658b8693e8
            ghcr.io/mgmods/jeho-own-backend:mg-jeho-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/mgmods/JEHO-App
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=JEHO-OWN backend and dashboard
