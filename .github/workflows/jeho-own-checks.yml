name: JEHO-OWN Backend and Dashboard Checks

on:
  push:
    branches: [jeho-own, jeho-own-working-2026-10-05, MG-JEHO, MG-JEHO-dm-notifications-20261107, fix/all-games-fcm-seat-medal-20261108]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [jeho-own, MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

concurrency:
  group: jeho-checks-recovery-20261112-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  checks:
    name: Backend, Dashboard and Docker checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test JEHO schema migration lock concurrency
        working-directory: backend
        run: npm run test:schema-lock

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Validate production startup scripts
        working-directory: backend
        run: |
          node --check scripts/start-production.js
          node --check scripts/jeho-empty-schema-guard.js
          node --check scripts/test-cp-bootstrap-postgres.js

      - name: Backend TypeScript check
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: backend/dashboard
        run: npm ci

      - name: Dashboard dependency audit
        working-directory: backend/dashboard
        run: npm audit --audit-level=high || true

      - name: Build dashboard
        working-directory: backend/dashboard
        env:
          VITE_API_URL: /api/v1
          VITE_BASE: /admin/
        run: npm run build

      - name: Build combined API and dashboard image
        run: docker build --tag jeho-own-api:ci ./backend

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish JEHO-OWN image
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/mgmods/jeho-own-backend:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            ghcr.io/mgmods/jeho-own-backend:ghaymah-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            ${{ github.event_name == 'push' && 'ghcr.io/mgmods/jeho-own-backend:latest' || '' }}


  cp-postgres-integration:
    name: CP PostgreSQL fresh-install and upgrade tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cp_test
          POSTGRES_PASSWORD: cp_test_password
          POSTGRES_DB: cp_bootstrap_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cp_test -d cp_bootstrap_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test CP bootstrap against disposable PostgreSQL 17
        working-directory: backend
        env:
          CP_TEST_DATABASE_URL: postgresql://cp_test:cp_test_password@localhost:5432/cp_bootstrap_test
        run: npm run test:cp-bootstrap

  schema-lock-postgres-integration:
    name: JEHO schema advisory lock PostgreSQL concurrency test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jeho_lock_test
          POSTGRES_PASSWORD: jeho_lock_test_password
          POSTGRES_DB: jeho_lock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeho_lock_test -d jeho_lock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Test advisory lock across independent PostgreSQL sessions
        working-directory: backend
        env:
          SCHEMA_LOCK_TEST_DATABASE_URL: postgresql://jeho_lock_test:jeho_lock_test_password@localhost:5432/jeho_lock_test
        run: npm run test:schema-lock-postgres
