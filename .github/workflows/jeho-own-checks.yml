name: JEHO-OWN Backend and Dashboard Checks

on:
  push:
    branches: [jeho-own]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [jeho-own]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend TypeScript and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jeho-own
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run lint
      - name: Build backend
        run: npm run build

  dashboard:
    name: Dashboard production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jeho-own
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build dashboard
        env:
          VITE_API_URL: https://api.example.invalid/api/v1
          VITE_BASE: /admin/
        run: npm run build

  docker-image:
    name: Build combined API and dashboard image
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: jeho-own
      - name: Build Docker image
        run: docker build --tag jeho-own-api:ci ./backend
