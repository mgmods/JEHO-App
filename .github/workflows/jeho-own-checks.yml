name: JEHO-OWN Backend and Dashboard Checks

on:
  push:
    branches: [jeho-own, jeho-own-working-2026-10-05]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [jeho-own]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Backend, Dashboard and Docker checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Backend dependency audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Backend TypeScript check
        working-directory: backend
        run: npm run lint

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install dashboard dependencies
        working-directory: backend/dashboard
        run: npm ci

      - name: Dashboard dependency audit
        working-directory: backend/dashboard
        run: npm audit --audit-level=high || true

      - name: Build dashboard
        working-directory: backend/dashboard
        env:
          VITE_API_URL: /api/v1
          VITE_BASE: /admin/
        run: npm run build

      - name: Build combined API and dashboard image
        run: docker build --tag jeho-own-api:ci ./backend
