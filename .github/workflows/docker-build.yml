name: Docker Build Test

on:
  push:
    branches:
      - jeho-own-clean-latest-2026-10-08
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI-only backend environment
        shell: bash
        run: |
          cp backend/.env.example backend/.env
          sed -i             -e 's/^NODE_ENV=.*/NODE_ENV=production/'             -e 's/^DB_HOST=.*/DB_HOST=postgres/'             -e 's/^DB_PORT=.*/DB_PORT=5432/'             -e 's/^DB_USERNAME=.*/DB_USERNAME=auralive/'             -e 's/^DB_PASSWORD=.*/DB_PASSWORD=ci_only_password/'             -e 's/^DB_DATABASE=.*/DB_DATABASE=auralive/'             -e 's/^REDIS_HOST=.*/REDIS_HOST=redis/'             -e 's/^REDIS_PORT=.*/REDIS_PORT=6379/'             -e 's/^JWT_SECRET=.*/JWT_SECRET=ci_only_jwt_secret_32_characters_long_123/'             -e 's/^JWT_REFRESH_SECRET=.*/JWT_REFRESH_SECRET=ci_only_refresh_secret_32_chars_12345/'             -e 's|^UPLOAD_DIR=.*|UPLOAD_DIR=/app/uploads|'             -e 's|^PUBLIC_API_ORIGIN=.*|PUBLIC_API_ORIGIN=http://localhost:3000|'             backend/.env
          chmod 600 backend/.env
          cat > .env <<'EOF'
          DB_USERNAME=auralive
          DB_PASSWORD=ci_only_password
          DB_DATABASE=auralive
          API_PORT=3000
          EOF
          chmod 600 .env

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jeho-backend:ci

      - name: Validate Compose configuration
        run: docker compose config

      - name: Start Postgres, Redis and Backend
        run: docker compose up -d --build

      - name: Wait for services
        shell: bash
        run: |
          for i in {1..30}; do
            if docker compose ps --status running | grep -q "jeho-backend"; then
              break
            fi
            sleep 2
          done
          docker compose ps
          docker compose ps --status running | grep -q "jeho-postgres"
          docker compose ps --status running | grep -q "jeho-redis"
          docker compose ps --status running | grep -q "jeho-backend"

      - name: Smoke test Backend and Swagger
        shell: bash
        run: |
          for i in {1..30}; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/api/docs || true)
            if [ "$code" = "200" ] || [ "$code" = "301" ] || [ "$code" = "302" ]; then
              echo "Backend is responding with HTTP $code"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not become ready"
          docker compose logs --no-color backend
          exit 1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
