name: Backend CI

on:
  push:
    branches: [MG-JEHO, jeho-own]
    paths:
      - ".github/workflows/backend-ci.yml"
      - "backend/**"
  pull_request:
    branches: [MG-JEHO, jeho-own]
    paths:
      - ".github/workflows/backend-ci.yml"
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: jeho-backend-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout backend source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            backend/**

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Build NestJS backend
        run: npm run build
