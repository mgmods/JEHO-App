name: Android Universal APK
# JEHO Stories build validation pipeline
# Compile and release both validate the same current MG-JEHO Android source.
# CI validation marker: advertisement system completion pass.

on:
  push:
    branches: [MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
      - "backend/src/database/**"
      - "backend/src/modules/auth/**"
      - "backend/src/modules/cp/**"
      - "backend/src/modules/gifts/**"
      - "backend/src/modules/rooms/**"
      - "backend/src/modules/users/**"
      - "backend/src/modules/vip/**"
      - "backend/src/modules/wallet/**"
      - "backend/src/modules/advertisements/**"
      - "backend/dashboard/src/views/AdvertisementsView.vue"
      - "backend/database/migrations/**"
      - "backend/scripts/**"
      - "backend/public/mall/**"
  pull_request:
    branches: [MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
      - "backend/src/database/**"
      - "backend/src/modules/auth/**"
      - "backend/src/modules/cp/**"
      - "backend/src/modules/gifts/**"
      - "backend/src/modules/rooms/**"
      - "backend/src/modules/users/**"
      - "backend/src/modules/vip/**"
      - "backend/src/modules/wallet/**"
      - "backend/public/mall/**"
      - "backend/src/modules/advertisements/**"
      - "backend/dashboard/src/views/AdvertisementsView.vue"
      - "backend/database/migrations/**"
      - "backend/scripts/**"
  workflow_dispatch:

concurrency:
  group: jeho-android-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compile-debug:
    name: Android compile check (no release secrets required)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Android sources and bundled mall pages
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            android/**
            backend/public/mall/**
      - name: Losslessly compress PNG drawable resources on the PR branch
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'MG-JEHO-PERFORMANCE-') }}
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y webp
          converted=0
          saved=0
          while IFS= read -r -d '' source; do
            target="${source%.png}.webp"
            if ! cwebp -quiet -lossless -m 6 -mt -metadata icc "$source" -o "$target"; then
              rm -f "$target"
              continue
            fi
            original_bytes="$(stat -c '%s' "$source")"
            optimized_bytes="$(stat -c '%s' "$target")"
            if (( optimized_bytes < original_bytes )); then
              rm "$source"
              converted=$((converted + 1))
              saved=$((saved + original_bytes - optimized_bytes))
            else
              rm "$target"
            fi
          done < <(find android/app/src/main/res -type f -path '*/drawable*/*' -name '*.png' ! -name '*.9.png' -print0)
          saved_mib="$(awk -v n="$saved" 'BEGIN { printf "%.2f", n/1048576 }')"
          echo "Losslessly converted $converted PNGs; saved $saved_mib MiB."
          if (( converted > 0 )); then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A android/app/src/main/res
            git commit -m "perf(android): losslessly compress drawable resources"
            git fetch origin "$PR_BRANCH"
            git rebase "origin/$PR_BRANCH"
            git push origin "HEAD:$PR_BRANCH"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Accept Android SDK licenses
        shell: bash
        run: set +o pipefail; yes | sdkmanager --licenses
      - name: Install Android SDK 36 and pinned NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12433566"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile debug variant against Ghaymah
        working-directory: android
        env:
          JEHO_OWN_API_URL: https://jeho-own-web-910481ae.hosted.cumin.dev/api/v1
        run: gradle --no-daemon -PJEHO_OWN_API_URL="$JEHO_OWN_API_URL" assembleDebug

  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            android/**
            !android/app/keystore.properties
            !android/app/keystore/**
            backend/public/mall/**

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set stable Android user home for signing
        shell: bash
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "JEHO_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Found Android SDK command-line tools."

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses

      - name: Install Android SDK 36 and required NDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.12433566"
          test -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/ndk/28.0.12433566"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate JEHO-OWN Ghaymah API URL
        env:
          JEHO_OWN_API_URL: https://jeho-own-web-910481ae.hosted.cumin.dev/api/v1
        shell: bash
        run: |
          set -euo pipefail
          case "$JEHO_OWN_API_URL" in
            https://jeho-own-web-910481ae.hosted.cumin.dev/api/v1) ;;
            *) echo "::error::APK API target must be the approved JEHO-OWN Ghaymah service."; exit 1 ;;
          esac

      - name: Restore stable JEHO release signing keystore
        shell: bash
        env:
          JEHO_SIGNING_KEYSTORE_BASE64: ${{ secrets.JEHO_SIGNING_KEYSTORE_BASE64 }}
          JEHO_SIGNING_STORE_PASSWORD: ${{ secrets.JEHO_SIGNING_STORE_PASSWORD }}
          JEHO_SIGNING_KEY_ALIAS: ${{ secrets.JEHO_SIGNING_KEY_ALIAS }}
          JEHO_SIGNING_KEY_PASSWORD: ${{ secrets.JEHO_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${JEHO_SIGNING_KEYSTORE_BASE64:-}" || -z "${JEHO_SIGNING_STORE_PASSWORD:-}" || -z "${JEHO_SIGNING_KEY_ALIAS:-}" || -z "${JEHO_SIGNING_KEY_PASSWORD:-}" ]]; then
            echo "::error::Stable signing-key GitHub Actions secrets are not configured. Refusing to create an APK with an unverified signature."
            exit 1
          fi
          KEYSTORE="$HOME/.android/jeho-original-signing.jks"
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$JEHO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          KEY_INFO="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$JEHO_SIGNING_STORE_PASSWORD" -alias "$JEHO_SIGNING_KEY_ALIAS")"
          printf '%s\n' "$KEY_INFO" | grep -E 'Alias name:|SHA1:|SHA256:'
          EXPECTED_SHA1="FE544713A2726865005599472B4527C62818E696"
          ACTUAL_SHA1="$(printf '%s\n' "$KEY_INFO" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "::error::Signing key does not match the previously verified installed JEHO APK key."
            echo "::error::Expected stable SHA-1: $EXPECTED_SHA1"
            echo "::error::Available key SHA-1: ${ACTUAL_SHA1:-not detected}"
            exit 1
          fi
          {
            echo "JEHO_RELEASE_KEYSTORE=$KEYSTORE"
            echo "JEHO_RELEASE_STORE_PASSWORD=$JEHO_SIGNING_STORE_PASSWORD"
            echo "JEHO_RELEASE_KEY_ALIAS=$JEHO_SIGNING_KEY_ALIAS"
            echo "JEHO_RELEASE_KEY_PASSWORD=$JEHO_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Verified: stable JEHO release signing key matches."

      - name: Configure stable release signing
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<EOF
          API_BASE_URL=https://jeho-own-web-910481ae.hosted.cumin.dev/api/v1
          STORE_FILE=$JEHO_RELEASE_KEYSTORE
          STORE_PASSWORD=$JEHO_RELEASE_STORE_PASSWORD
          KEY_ALIAS=$JEHO_RELEASE_KEY_ALIAS
          KEY_PASSWORD=$JEHO_RELEASE_KEY_PASSWORD
          EOF

      - name: Build universal release APK
        working-directory: android
        env:
          JEHO_OWN_API_URL: https://jeho-own-web-910481ae.hosted.cumin.dev/api/v1
        run: gradle --no-daemon -PJEHO_OWN_API_URL="$JEHO_OWN_API_URL" assembleRelease

      - name: Verify universal APK, HTML assets, and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-universal-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::Universal release APK was not produced at expected path: $APK"
            find android/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERT_OUTPUT"
          EXPECTED_SHA1="FE544713A2726865005599472B4527C62818E696"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: //Ip' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "::error::Universal APK signing certificate mismatch."
            echo "::error::Expected $EXPECTED_SHA1; got ${ACTUAL_SHA1:-not detected}"
            exit 1
          fi
          APK_BYTES="$(stat -c '%s' "$APK")"
          APK_MIB="$(awk -v n="$APK_BYTES" 'BEGIN {print n/1048576}')"
          printf '%s  %s bytes (%.2f MiB)\n' "$(basename "$APK")" "$APK_BYTES" "$APK_MIB"
          if (( APK_BYTES > 104857600 )); then
            echo "::error::Universal APK is larger than 100 MiB; refusing to publish an oversized artifact."
            exit 1
          fi
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          grep -q '^lib/armeabi-v7a/.*\.so$' <<< "$APK_ENTRIES" || { echo "::error::ARM 32-bit native libraries are missing."; exit 1; }
          grep -q '^lib/arm64-v8a/.*\.so$' <<< "$APK_ENTRIES" || { echo "::error::ARM 64-bit native libraries are missing."; exit 1; }
          if grep -Eq '^lib/(x86|x86_64)/' <<< "$APK_ENTRIES"; then
            echo "::error::Unexpected x86 libraries remain in the phone universal APK."
            exit 1
          fi
          for HTML in cp-center.html cp-insights.html wealth-insights.html wealth-ranking.html; do
            if ! unzip -Z1 "$APK" | grep -E "(^|/)${HTML}$" -q; then
              echo "::error::Required in-app HTML asset missing inside universal APK: $HTML"
              exit 1
            fi
          done
          echo "Verified: universal APK contains both ARM phone ABIs, required HTML pages, and the approved signing key."

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: JEHO-MG-JEHO-Universal-Update-APK
          path: android/app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Verify architecture-specific APKs
        shell: bash
        run: |
          set -euo pipefail
          OUT="android/app/build/outputs/apk/release"
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools -type f -name apksigner -print | sort -V | tail -n 1)"
          EXPECTED_SHA1="FE544713A2726865005599472B4527C62818E696"
          for ABI in arm64-v8a armeabi-v7a; do
            APK="$OUT/app-${ABI}-release.apk"
            if [[ ! -f "$APK" ]]; then
              echo "::error::Expected split APK missing: $APK"
              find "$OUT" -maxdepth 1 -type f -name '*.apk' -print || true
              exit 1
            fi
            CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
            ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: //Ip' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
              echo "::error::${ABI} APK signing certificate mismatch."
              exit 1
            fi
            APK_BYTES="$(stat -c '%s' "$APK")"
            APK_MIB="$(awk -v n="$APK_BYTES" 'BEGIN {print n/1048576}')"
            printf '%s  %s bytes (%.2f MiB)\n' "$(basename "$APK")" "$APK_BYTES" "$APK_MIB"
            ENTRIES="$(unzip -Z1 "$APK")"
            grep -q "^lib/${ABI}/.*\.so$" <<< "$ENTRIES" || { echo "::error::${ABI} native libraries missing."; exit 1; }
            if [[ "$ABI" == "arm64-v8a" ]] && grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/' <<< "$ENTRIES"; then
              echo "::error::ARM64 split contains extra ABI libraries."
              exit 1
            fi
          done
          echo "Verified: architecture-specific APKs retain the existing JEHO signing certificate and contain only their intended ABI."

      - name: Upload ARM64 phone APK (smaller install package)
        uses: actions/upload-artifact@v4
        with:
          name: JEHO-MG-JEHO-ARM64-Update-APK
          path: android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload ARMv7 compatibility APK
        uses: actions/upload-artifact@v4
        with:
          name: JEHO-MG-JEHO-ARMv7-Update-APK
          path: android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 7


      - name: Check Appetize preview token
        id: appetize-config
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${APPETIZE_API_TOKEN:-}" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Appetize upload skipped: add APPETIZE_API_TOKEN in repository Actions secrets to enable phone preview."
          fi

      - name: Upload to Appetize preview
        id: appetize-upload
        if: steps.appetize-config.outputs.configured == 'true'
        uses: appetizeio/github-action-appetize@v1.1.0
        with:
          apiToken: ${{ secrets.APPETIZE_API_TOKEN }}
          publicKey: ${{ secrets.APPETIZE_PUBLIC_KEY }}
          appFile: android/app/build/outputs/apk/release/app-universal-release.apk
          platform: android
          note: JEHO CHAT MG-JEHO preview ${{ github.sha }}

      - name: Publish Appetize preview link
        if: steps.appetize-config.outputs.configured == 'true'
        env:
          APPETIZE_PUBLIC_KEY: ${{ steps.appetize-upload.outputs.publicKey }}
        shell: bash
        run: |
          {
            echo "## JEHO CHAT phone preview"
            echo
            echo "Open the Android preview in your browser: https://appetize.io/app/${APPETIZE_PUBLIC_KEY}"
            echo
            if [[ -z "${{ secrets.APPETIZE_PUBLIC_KEY }}" ]]; then
              echo "First upload created an Appetize app. Save its public key as the repository Actions secret APPETIZE_PUBLIC_KEY before future builds, so they update the same preview."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
