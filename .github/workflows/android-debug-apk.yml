name: Android Debug APK

on:
  push:
    branches: [jeho-own, MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
  pull_request:
    branches: [jeho-own, MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
  workflow_dispatch:

concurrency:
  group: jeho-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            android/**
            !android/app/keystore.properties
            !android/app/keystore/**

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Found Android SDK command-line tools."

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate JEHO-OWN Blitz API URL
        env:
          JEHO_OWN_API_URL: https://jeho-own-backend.mgs.blitz.cloud/api/v1
        shell: bash
        run: |
          if [[ "$JEHO_OWN_API_URL" != "https://jeho-own-backend.mgs.blitz.cloud/api/v1" ]]; then
            echo "::error::The APK must target the JEHO-OWN Blitz Cloud API."
            exit 1
          fi

      # Keep one stable debug signing certificate across ephemeral GitHub runners.
      # Google OAuth Android clients are tied to the package name + signing SHA-1.
      - name: Restore stable CI debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jeho-android-debug-keystore-v2

      - name: Create temporary Android debug keystore
        shell: bash
        run: |
          KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [[ ! -f "$KEYSTORE" ]]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          echo "Temporary CI debug keystore is ready."

      - name: Print Android signing fingerprints
        working-directory: android
        run: gradle --no-daemon signingReport

      - name: Build debug APK
        working-directory: android
        env:
          JEHO_OWN_API_URL: https://jeho-own-backend.mgs.blitz.cloud/api/v1
        run: gradle --no-daemon -PJEHO_OWN_API_URL="$JEHO_OWN_API_URL" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEHO-MG-JEHO-Update-APK
          path: android/app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 7

# The stable debug keystore is cached across ephemeral GitHub runners.
