name: Android Debug APK

on:
  push:
    branches: [jeho-own]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-url-required:
    if: ${{ vars.JEHO_OWN_API_URL == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain required configuration
        run: echo '::notice::APK build is intentionally skipped until the repository variable JEHO_OWN_API_URL points to the deployed JEHO-OWN API ending in /api/v1.'

  build-debug-apk:
    if: ${{ vars.JEHO_OWN_API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            android/**
            !android/app/keystore.properties
            !android/app/keystore/**

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Found Android SDK command-line tools."

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate independent API URL
        env:
          JEHO_OWN_API_URL: ${{ vars.JEHO_OWN_API_URL }}
        shell: bash
        run: |
          if [[ ! "$JEHO_OWN_API_URL" =~ ^https://[^[:space:]]+/api/v1/?$ ]]; then
            echo "::error::Set JEHO_OWN_API_URL to the HTTPS JEHO-OWN backend URL ending in /api/v1."
            exit 1
          fi

      - name: Create temporary Android debug keystore
        shell: bash
        run: |
          KEYSTORE="$HOME/.config/.android/debug.keystore"
          mkdir -p "$(dirname "$KEYSTORE")"
          if [[ ! -f "$KEYSTORE" ]]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s "$KEYSTORE"
          echo "Temporary CI debug keystore is ready."

      - name: Print Android signing fingerprints
        working-directory: android
        run: |
          gradle --no-daemon signingReport

      - name: Build debug APK
        working-directory: android
        env:
          JEHO_OWN_API_URL: ${{ vars.JEHO_OWN_API_URL }}
        run: gradle --no-daemon -PJEHO_OWN_API_URL="$JEHO_OWN_API_URL" assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JEHO-App-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

# Re-run CI to capture the debug signing SHA-1 for Google OAuth.
