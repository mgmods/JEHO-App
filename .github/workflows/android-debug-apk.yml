name: Android Debug APK

on:
  push:
    branches: [jeho-own, MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
      - "backend/public/mall/**"
  pull_request:
    branches: [jeho-own, MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
      - "backend/public/mall/**"
  workflow_dispatch:

concurrency:
  group: jeho-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            android/**
            !android/app/keystore.properties
            !android/app/keystore/**
            backend/public/mall/**

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set stable Android user home for signing
        shell: bash
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "JEHO_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Found Android SDK command-line tools."

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate JEHO-OWN Blitz API URL
        env:
          JEHO_OWN_API_URL: https://jeho-own-backend.mgs.blitz.cloud/api/v1
        shell: bash
        run: |
          if [[ "$JEHO_OWN_API_URL" != "https://jeho-own-backend.mgs.blitz.cloud/api/v1" ]]; then
            echo "::error::The APK must target the JEHO-OWN Blitz Cloud API."
            exit 1
          fi

      - name: Restore stable JEHO release signing keystore
        shell: bash
        env:
          JEHO_SIGNING_KEYSTORE_BASE64: ${{ secrets.JEHO_SIGNING_KEYSTORE_BASE64 }}
          JEHO_SIGNING_STORE_PASSWORD: ${{ secrets.JEHO_SIGNING_STORE_PASSWORD }}
          JEHO_SIGNING_KEY_ALIAS: ${{ secrets.JEHO_SIGNING_KEY_ALIAS }}
          JEHO_SIGNING_KEY_PASSWORD: ${{ secrets.JEHO_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${JEHO_SIGNING_KEYSTORE_BASE64:-}" || -z "${JEHO_SIGNING_STORE_PASSWORD:-}" || -z "${JEHO_SIGNING_KEY_ALIAS:-}" || -z "${JEHO_SIGNING_KEY_PASSWORD:-}" ]]; then
            echo "::error::Stable signing-key GitHub Actions secrets are not configured. Refusing to create an APK with an unverified signature."
            exit 1
          fi
          KEYSTORE="$HOME/.android/jeho-original-signing.jks"
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$JEHO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          KEY_INFO="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$JEHO_SIGNING_STORE_PASSWORD" -alias "$JEHO_SIGNING_KEY_ALIAS")"
          printf '%s\n' "$KEY_INFO" | grep -E 'Alias name:|SHA1:|SHA256:'
          EXPECTED_BASELINE_SHA1="FE544713A2726865005599472B4527C62818E696"
          ACTUAL_KEY_SHA1="$(printf '%s\n' "$KEY_INFO" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_KEY_SHA1" != "$EXPECTED_BASELINE_SHA1" ]]; then
            echo "::error::Signing key does not match the previously verified installed JEHO APK key."
            echo "::error::Expected stable SHA-1: $EXPECTED_BASELINE_SHA1"
            echo "::error::Available key SHA-1: ${ACTUAL_KEY_SHA1:-not detected}"
            exit 1
          fi
          {
            echo "JEHO_DEBUG_KEYSTORE=$KEYSTORE"
            echo "JEHO_DEBUG_STORE_PASSWORD=$JEHO_SIGNING_STORE_PASSWORD"
            echo "JEHO_DEBUG_KEY_ALIAS=$JEHO_SIGNING_KEY_ALIAS"
            echo "JEHO_DEBUG_KEY_PASSWORD=$JEHO_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Verified: stable JEHO release signing key matches."

      - name: Verify original signing key
        shell: bash
        run: |
          keytool -list -v -keystore "$JEHO_DEBUG_KEYSTORE" -storepass "$JEHO_DEBUG_STORE_PASSWORD" -alias "$JEHO_DEBUG_KEY_ALIAS" | grep -E 'Alias name:|SHA1:|SHA256:'

      - name: Print Android signing fingerprints
        working-directory: android
        run: gradle --no-daemon signingReport

      - name: Build ABI-specific debug APKs
        working-directory: android
        env:
          JEHO_OWN_API_URL: https://jeho-own-backend.mgs.blitz.cloud/api/v1
        run: gradle --no-daemon -PJEHO_OWN_API_URL="$JEHO_OWN_API_URL" assembleDebug

      - name: Verify both ABI APKs, HTML assets, and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="android/app/build/outputs/apk/debug"
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          shopt -s nullglob
          APK_FILES=("$APK_DIR"/*-armeabi-v7a-debug.apk "$APK_DIR"/*-arm64-v8a-debug.apk)
          if (( ${#APK_FILES[@]} != 2 )); then
            echo "::error::Expected exactly two ABI-specific APKs (armeabi-v7a and arm64-v8a); found ${#APK_FILES[@]}."
            find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          for ABI in armeabi-v7a arm64-v8a; do
            FOUND=0
            for APK in "${APK_FILES[@]}"; do
              [[ "$APK" == *"$ABI"* ]] && FOUND=1
            done
            if [[ "$FOUND" != 1 ]]; then
              echo "::error::Missing APK for $ABI."
              exit 1
            fi
          done
          EXPECTED_SHA1="FE544713A2726865005599472B4527C62818E696"
          for APK in "${APK_FILES[@]}"; do
            echo "Checking $APK"
            CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
            echo "$CERT_OUTPUT"
            ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: //Ip' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
              echo "::error::APK signing certificate mismatch for $APK."
              echo "::error::Expected $EXPECTED_SHA1; got ${ACTUAL_SHA1:-not detected}"
              exit 1
            fi
            printf '%s  %s bytes (%.2f MiB)\n' "$(basename "$APK")" "$(stat -c '%s' "$APK")" "$(awk -v n="$(stat -c '%s' "$APK")" 'BEGIN {print n/1048576}')"
          done
          for APK in "${APK_FILES[@]}"; do
            for HTML in cp-center.html cp-insights.html wealth-insights.html wealth-ranking.html; do
              if ! unzip -Z1 "$APK" | grep -E "(^|/)${HTML}$" -q; then
                echo "::error::Required in-app HTML asset missing inside $(basename "$APK"): $HTML"
                exit 1
              fi
            done
          done
          echo "Verified: both ABI APKs use the approved signing key and contain required HTML pages."

      - name: Upload ABI-specific APKs
        uses: actions/upload-artifact@v4
        with:
          name: JEHO-MG-JEHO-Update-APK-ABI-SPLITS
          path: |
            android/app/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
            android/app/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
