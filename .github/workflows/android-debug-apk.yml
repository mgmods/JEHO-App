name: Android Universal APK

on:
  push:
    branches: [jeho-own, MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
      - "backend/public/mall/**"
  pull_request:
    branches: [jeho-own, MG-JEHO]
    paths:
      - ".github/workflows/android-debug-apk.yml"
      - "android/**"
      - "backend/src/modules/config/**"
      - "backend/src/modules/uploads/**"
      - "backend/public/mall/**"
  workflow_dispatch:

concurrency:
  group: jeho-android-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android project only
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            android/**
            !android/app/keystore.properties
            !android/app/keystore/**
            backend/public/mall/**

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set stable Android user home for signing
        shell: bash
        run: |
          echo "ANDROID_USER_HOME=$HOME/.android" >> "$GITHUB_ENV"
          echo "JEHO_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.android"

      - name: Locate Android SDK tools
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/cmdline-tools" ]]; then
            echo "::error::Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT/cmdline-tools."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "Found Android SDK command-line tools."

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate JEHO-OWN Blitz API URL
        env:
          JEHO_OWN_API_URL: https://jeho-own-backend.mgs.blitz.cloud/api/v1
        shell: bash
        run: |
          if [[ "$JEHO_OWN_API_URL" != "https://jeho-own-backend.mgs.blitz.cloud/api/v1" ]]; then
            echo "::error::The APK must target the JEHO-OWN Blitz Cloud API."
            exit 1
          fi

      - name: Restore stable JEHO release signing keystore
        shell: bash
        env:
          JEHO_SIGNING_KEYSTORE_BASE64: ${{ secrets.JEHO_SIGNING_KEYSTORE_BASE64 }}
          JEHO_SIGNING_STORE_PASSWORD: ${{ secrets.JEHO_SIGNING_STORE_PASSWORD }}
          JEHO_SIGNING_KEY_ALIAS: ${{ secrets.JEHO_SIGNING_KEY_ALIAS }}
          JEHO_SIGNING_KEY_PASSWORD: ${{ secrets.JEHO_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${JEHO_SIGNING_KEYSTORE_BASE64:-}" || -z "${JEHO_SIGNING_STORE_PASSWORD:-}" || -z "${JEHO_SIGNING_KEY_ALIAS:-}" || -z "${JEHO_SIGNING_KEY_PASSWORD:-}" ]]; then
            echo "::error::Stable signing-key GitHub Actions secrets are not configured. Refusing to create an APK with an unverified signature."
            exit 1
          fi
          KEYSTORE="$HOME/.android/jeho-original-signing.jks"
          mkdir -p "$(dirname "$KEYSTORE")"
          printf '%s' "$JEHO_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          KEY_INFO="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$JEHO_SIGNING_STORE_PASSWORD" -alias "$JEHO_SIGNING_KEY_ALIAS")"
          printf '%s\n' "$KEY_INFO" | grep -E 'Alias name:|SHA1:|SHA256:'
          EXPECTED_SHA1="FE544713A2726865005599472B4527C62818E696"
          ACTUAL_SHA1="$(printf '%s\n' "$KEY_INFO" | sed -n 's/^[[:space:]]*SHA1: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "::error::Signing key does not match the previously verified installed JEHO APK key."
            echo "::error::Expected stable SHA-1: $EXPECTED_SHA1"
            echo "::error::Available key SHA-1: ${ACTUAL_SHA1:-not detected}"
            exit 1
          fi
          {
            echo "JEHO_RELEASE_KEYSTORE=$KEYSTORE"
            echo "JEHO_RELEASE_STORE_PASSWORD=$JEHO_SIGNING_STORE_PASSWORD"
            echo "JEHO_RELEASE_KEY_ALIAS=$JEHO_SIGNING_KEY_ALIAS"
            echo "JEHO_RELEASE_KEY_PASSWORD=$JEHO_SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Verified: stable JEHO release signing key matches."

      - name: Configure stable release signing
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          cat > local.properties <<EOF
          API_BASE_URL=https://jeho-own-backend.mgs.blitz.cloud/api/v1
          STORE_FILE=$JEHO_RELEASE_KEYSTORE
          STORE_PASSWORD=$JEHO_RELEASE_STORE_PASSWORD
          KEY_ALIAS=$JEHO_RELEASE_KEY_ALIAS
          KEY_PASSWORD=$JEHO_RELEASE_KEY_PASSWORD
          EOF

      - name: Build universal release APK
        working-directory: android
        env:
          JEHO_OWN_API_URL: https://jeho-own-backend.mgs.blitz.cloud/api/v1
        run: gradle --no-daemon -PJEHO_OWN_API_URL="$JEHO_OWN_API_URL" assembleRelease

      - name: Verify universal APK, HTML assets, and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-universal-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::Universal release APK was not produced at expected path: $APK"
            find android/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          APKSIGNER="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"/build-tools -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "$APKSIGNER" ]]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          CERT_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK")"
          echo "$CERT_OUTPUT"
          EXPECTED_SHA1="FE544713A2726865005599472B4527C62818E696"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/.*certificate SHA-1 digest: //Ip' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]]; then
            echo "::error::Universal APK signing certificate mismatch."
            echo "::error::Expected $EXPECTED_SHA1; got ${ACTUAL_SHA1:-not detected}"
            exit 1
          fi
          APK_BYTES="$(stat -c '%s' "$APK")"
          APK_MIB="$(awk -v n="$APK_BYTES" 'BEGIN {print n/1048576}')"
          printf '%s  %s bytes (%.2f MiB)\n' "$(basename "$APK")" "$APK_BYTES" "$APK_MIB"
          if (( APK_BYTES > 104857600 )); then
            echo "::error::Universal APK is larger than 100 MiB; refusing to publish an oversized artifact."
            exit 1
          fi
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          grep -q '^lib/armeabi-v7a/.*\.so$' <<< "$APK_ENTRIES" || { echo "::error::ARM 32-bit native libraries are missing."; exit 1; }
          grep -q '^lib/arm64-v8a/.*\.so$' <<< "$APK_ENTRIES" || { echo "::error::ARM 64-bit native libraries are missing."; exit 1; }
          if grep -Eq '^lib/(x86|x86_64)/' <<< "$APK_ENTRIES"; then
            echo "::error::Unexpected x86 libraries remain in the phone universal APK."
            exit 1
          fi
          for HTML in cp-center.html cp-insights.html wealth-insights.html wealth-ranking.html; do
            if ! unzip -Z1 "$APK" | grep -E "(^|/)${HTML}$" -q; then
              echo "::error::Required in-app HTML asset missing inside universal APK: $HTML"
              exit 1
            fi
          done
          echo "Verified: universal APK contains both ARM phone ABIs, required HTML pages, and the approved signing key."

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: JEHO-MG-JEHO-Universal-Update-APK
          path: android/app/build/outputs/apk/release/app-universal-release.apk
          if-no-files-found: error
          retention-days: 7
