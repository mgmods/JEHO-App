name: JEHO-OWN backend validation

on:
  push:
    branches:
      - jeho-own-fix-startup-logging-2026-10-09
    paths:
      - 'backend/**'
      - '.github/workflows/jeho-own-backend-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/jeho-own-backend-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check backend
        run: npm run lint
      - name: Build backend
        run: npm run build
