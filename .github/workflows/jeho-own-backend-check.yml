name: JEHO-OWN backend validation

on:
  push:
    branches:
      - jeho-own-fix-startup-logging-2026-10-09
    paths:
      - 'backend/**'
      - '.github/workflows/jeho-own-backend-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/jeho-own-backend-check.yml'

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check backend
        run: npm run lint
      - name: Build backend
        run: npm run build
      - name: Validate production Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: jeho-own-backend:startup-logging-check

  publish-fix-image:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish isolated startup-logging fix image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/mgmods/jeho-own-backend:startup-logging-${{ github.sha }}
