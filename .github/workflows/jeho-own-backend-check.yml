name: JEHO-OWN Backend Checks

on:
  push:
    branches: [jeho-own]
    paths:
      - "backend/**"
      - ".github/workflows/jeho-own-backend-check.yml"
  pull_request:
    branches: [jeho-own]
    paths:
      - "backend/**"
      - ".github/workflows/jeho-own-backend-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout JEHO-OWN branch
        uses: actions/checkout@v4
        with:
          ref: jeho-own
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check backend
        run: npm run lint
      - name: Build backend
        run: npm run build
