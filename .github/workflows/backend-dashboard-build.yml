name: Backend and Dashboard Build Validation

on:
  push:
    branches: [MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/backend-dashboard-build.yml"
  pull_request:
    branches: [MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/backend-dashboard-build.yml"
  workflow_dispatch:

concurrency:
  group: jeho-backend-dashboard-recovery-20261112-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build:
    name: NestJS API build and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jeho_test
          POSTGRES_PASSWORD: jeho_test_password
          POSTGRES_DB: jeho_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jeho_test -d jeho_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Compile API
        working-directory: backend
        run: npm run build
      - name: Verify Firebase Admin module compatibility
        working-directory: backend
        run: node -e "const a=require('firebase-admin'); if(!a.auth || !a.app) process.exit(1); console.log('Firebase Admin import OK')"
      - name: Run authentication and realtime room regression tests
        working-directory: backend
        run: npm run test:auth-room
      - name: Run games regression tests
        working-directory: backend
        run: npm run test:games
      - name: Run CP PostgreSQL bootstrap and upgrade tests
        working-directory: backend
        env:
          CP_TEST_DATABASE_URL: postgresql://jeho_test:jeho_test_password@localhost:5432/jeho_test
        run: npm run test:cp-bootstrap

  dashboard-build:
    name: Vue dashboard clean install and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22 for dashboard dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/dashboard/package-lock.json
      - name: Install locked dependencies
        working-directory: backend/dashboard
        run: npm ci
      - name: Compile dashboard
        working-directory: backend/dashboard
        run: npm run build

  docker-image-build:
    name: Full multi-stage Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build JEHO backend and dashboard image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: jeho-ci:security-validation
