name: Backend and Dashboard Build Validation

on:
  push:
    branches: [MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/backend-dashboard-build.yml"
  pull_request:
    branches: [MG-JEHO]
    paths:
      - "backend/**"
      - ".github/workflows/backend-dashboard-build.yml"
  workflow_dispatch:

concurrency:
  group: jeho-backend-dashboard-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build:
    name: NestJS API build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install locked dependencies
        working-directory: backend
        run: npm ci
      - name: Compile API
        working-directory: backend
        run: npm run build

  dashboard-build:
    name: Vue dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/dashboard/package-lock.json
      - name: Install locked dependencies
        working-directory: backend/dashboard
        run: npm ci
      - name: Compile dashboard
        working-directory: backend/dashboard
        run: npm run build
